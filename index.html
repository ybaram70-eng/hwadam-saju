<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#20352d"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>화담철학관 만세력</title><style>html,body{margin:0;width:100%;height:100%;background:#f3efe6}iframe{display:block;width:100%;height:100%;border:0;background:#f3efe6;padding-bottom:76px;box-sizing:border-box}.bottomNav{position:fixed;z-index:9999;left:0;right:0;bottom:0;min-height:70px;padding:4px 4px calc(4px + env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border-top:1px solid #ddd8ce;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -3px 14px rgba(0,0,0,.07);backdrop-filter:blur(8px)}.navItem{border:0;background:transparent;color:#5f5f5f;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 1px;cursor:pointer;touch-action:manipulation;border-radius:12px}.navItem .ico{font-size:22px;line-height:1}.navItem .txt{font-size:11px;font-weight:800;white-space:nowrap}.navItem.active{color:#b94b1f;background:#fff6ef}.navItem:active{transform:scale(.97)}@media(min-width:800px){.bottomNav{left:50%;transform:translateX(-50%);max-width:760px;border-left:1px solid #eee7dc;border-right:1px solid #eee7dc;border-radius:16px 16px 0 0}}</style></head><body><iframe id="app" src="/stable.html?v=20260824-ui1" title="화담철학관 만세력"></iframe><nav class="bottomNav" aria-label="주요 메뉴"><button class="navItem active" data-target="home"><span class="ico">⌂</span><span class="txt">홈</span></button><button class="navItem" data-target="input"><span class="ico">✎</span><span class="txt">사주입력</span></button><button class="navItem" data-target="analysis"><span class="ico">♧</span><span class="txt">화담분석</span></button><button class="navItem" data-target="calendar"><span class="ico">▣</span><span class="txt">택일달력</span></button><button class="navItem" data-target="journal"><span class="ico">✣</span><span class="txt">화담일지</span></button></nav><script>const f=document.getElementById('app');let d=null,mode='main';function setActive(btn){document.querySelectorAll('.navItem').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}function topOf(el){return el?el.getBoundingClientRect().top+(d?.defaultView?.scrollY||0)-8:0}function addScript(id,src){if(!d.getElementById(id)){const s=d.createElement('script');s.id=id;s.src=src;d.body.appendChild(s)}}function setupMain(){try{d=f.contentDocument;if(!d)return;addScript('hwadam-ui-polish','/ui-polish.js?v=20260824-3');addScript('hwadam-progress-status','/progress-status.js?v=20260824-1');addScript('hwadam-twelve-stages','/twelve-stages.js?v=20260823-1');addScript('hwadam-detail-script','/detail-v2.js?v=20260821-1');addScript('hwadam-journal-script','/journal-v1.js?v=20260822-5');addScript('hwadam-journal-lunar-addon','/journal-lunar-addon.js?v=20260822-1');addScript('hwadam-journal-customer-filter','/journal-customer-filter.js?v=20260822-3');addScript('hwadam-journal-recent-click','/journal-recent-click.js?v=20260822-2');addScript('hwadam-journal-save-fix','/journal-save-fix.js?v=20260822-1')}catch(e){console.error(e)}}function loadMain(cb){if(mode!=='main'){mode='main';d=null;f.src='/stable.html?v=20260824-ui1';const once=()=>{f.removeEventListener('load',once);setupMain();if(cb)setTimeout(cb,150)};f.addEventListener('load',once)}else{setupMain();if(cb)cb()}}function findTarget(t){if(!d)return null;if(t==='home')return d.body;if(t==='input')return d.querySelector('.card')||d.getElementById('name');if(t==='analysis')return d.getElementById('result')||d.querySelector('.pillars');if(t==='journal')return d.querySelector('.journalPanel');return null}function goTarget(t,n=0){setupMain();const el=findTarget(t);if(el){d.defaultView.scrollTo({top:topOf(el),behavior:'smooth'});return}if(n<25)setTimeout(()=>goTarget(t,n+1),100)}document.querySelectorAll('.navItem').forEach(btn=>btn.onclick=()=>{const t=btn.dataset.target;setActive(btn);if(t==='calendar'){mode='calendar';d=null;f.src='/calendar-v1.html?v=20260821-4';return}loadMain(()=>goTarget(t))});f.addEventListener('load',()=>{if(mode==='main')setupMain()});</script></body></html>
