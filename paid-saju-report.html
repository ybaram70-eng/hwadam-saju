<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>화담철학관 | 결제한 상담 리포트</title>
<style>body{margin:0;background:#f3efe6;color:#20352d;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.8}.wrap{max-width:800px;margin:auto;padding:20px}.paper{background:white;padding:28px;border-radius:16px;box-shadow:0 2px 12px #0001}h1{font-size:24px;border-bottom:3px solid #20352d;padding-bottom:12px}#answer{white-space:normal;overflow-wrap:anywhere;color:#252525;font-size:15px}button,a.action{display:inline-block;margin:12px 8px 0 0;padding:12px 20px;background:#20352d;color:white;border:0;border-radius:10px;text-decoration:none;font-weight:700;cursor:pointer}#state{font-weight:700}#meta{color:#666}#report{display:none}@media print{body{background:white}.wrap{padding:0}.paper{box-shadow:none;padding:0}#actions,#state,#printHelp{display:none!important}#report{display:block!important}}</style><link rel="stylesheet" href="/color-report.css?v=20261123-2"></head>
<body><div class="wrap"><div class="paper"><div id="state" role="status">결제한 리포트를 확인하고 있습니다…</div><div id="report"><h1>화담철학관 정식 상담 리포트</h1><p id="meta"></p><h3>상담 질문</h3><p id="question"></p><h3>상담 결과</h3><div id="answer"></div><p style="font-size:12px;color:#777">명리학 해석은 참고용입니다.</p></div><div id="actions"><button id="print" hidden>PDF 저장 / 인쇄</button><button id="copyLink" hidden>리포트 주소 복사</button><p id="printHelp" style="font-size:14px;color:#555" hidden>휴대전화의 카카오톡 등 앱 내부 브라우저에서는 인쇄 창이 열리지 않을 수 있습니다. 「리포트 주소 복사」를 누르고 삼성 인터넷 또는 Chrome 주소창에 붙여넣어 연 뒤, 메뉴 → 인쇄 → PDF로 저장을 선택하세요. 같은 휴대전화라도 다른 브라우저에서 결제 확인 정보가 보이지 않을 수 있습니다. 이 경우 기존 화면에서 공유 메뉴의 인쇄 기능을 이용하고 다시 결제하지 마세요.</p><a class="action" href="/?open=journal">상담 기록·리포트</a></div></div></div>
<script src="/color-report.js?v=20261123-2"></script><script>
(async()=>{
const state=document.getElementById('state'),report=document.getElementById('report'),print=document.getElementById('print');
const rid=new URLSearchParams(location.search).get('paidReport')||new URLSearchParams(location.search).get('reportId')||'';
try{
if(!/^RPT-[A-Za-z0-9_-]{10,80}$/.test(rid))throw Error('리포트 번호가 없습니다. 결제 내역에서 다시 열어 주세요.');
let map={},last={};
try{map=JSON.parse(localStorage.getItem('hwadam_report_entitlements')||'{}')||{}}catch{}
try{last=JSON.parse(localStorage.getItem('hwadam_last_ai_consult')||'{}')||{}}catch{}
const token=map[rid]?.token;
if(!token)throw Error('이 기기에 결제 확인 정보가 없습니다. 다시 결제하지 마시고 결제했던 기기에서 열어 주세요.');
const res=await fetch('/api/report-entitlement',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({token,reportId:rid})});
const check=await res.json();
if(!res.ok||!check.ok)throw Error('결제 확인이 지연되거나 이용권을 확인할 수 없습니다. 다시 결제하지 마세요.');
if(last.reportId!==rid||!last.answer)throw Error('결제는 확인되었지만 이 기기에 상담 결과가 남아 있지 않습니다. 다시 결제하지 마시고 고객지원에 문의해 주세요.');
document.getElementById('meta').textContent=[last.chart?.name||'고객',last.at?new Date(last.at).toLocaleDateString('ko-KR'):''].filter(Boolean).join(' · ');
document.getElementById('question').textContent=last.question||'종합 상담';
const answerEl=document.getElementById('answer');if(window.hwadamColorReport){answerEl.replaceChildren(window.hwadamColorReport.render(last.answer))}else{answerEl.textContent=last.answer;answerEl.style.whiteSpace='pre-wrap'};
report.style.display='block';print.hidden=false;const help=document.getElementById('printHelp'),copy=document.getElementById('copyLink');copy.hidden=false;print.onclick=()=>{help.hidden=false;try{window.print()}catch(e){help.textContent='이 브라우저에서 인쇄 기능을 지원하지 않습니다. 브라우저 메뉴의 공유 또는 인쇄 기능을 이용해 PDF로 저장해 주세요.'}};copy.onclick=async()=>{try{await navigator.clipboard.writeText(location.href);help.hidden=false;help.textContent='리포트 주소를 복사했습니다. 삼성 인터넷 또는 Chrome 주소창에 붙여넣어 열어 주세요. 다른 브라우저에서 결제 내역이 안 보이면 기존 화면에서 인쇄하거나 다시 원래 브라우저로 돌아오세요. 다시 결제하지 마세요.'}catch{help.hidden=false;help.textContent='주소 복사가 제한되었습니다. 브라우저 상단 주소창의 주소를 복사해 주세요.'}};
state.textContent='결제가 확인되었습니다. 아래에서 정식 리포트를 확인하고 PDF로 저장할 수 있습니다.';
}catch(e){state.textContent=(e?.message||'리포트를 불러오지 못했습니다.')+' 고객님께 추가 결제를 요청하지 않습니다.';}
})();
</script></body></html>
