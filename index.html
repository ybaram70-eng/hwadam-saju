<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>화담철학관 60갑자</title>
<style>
:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#222;--muted:#6f6b64;--green:#20352d;--line:#e6ddcf;--gold:#d59a2a;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
.wrap{max-width:620px;margin:auto;padding:16px}
.hero{background:var(--green);color:#fff;padding:24px 22px;border-radius:24px;margin-bottom:14px}
.hero h1{margin:0 0 8px;font-size:28px}
.hero p{margin:0;color:#dbe4df;line-height:1.6;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
h2{font-size:20px;margin:0 0 14px}
.search{display:flex;gap:8px}
input{flex:1;border:1px solid #d9cfbf;border-radius:14px;padding:14px;font-size:16px;background:#fff}
button{border:0;border-radius:14px;background:var(--green);color:#fff;padding:0 16px;font-weight:800;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.item{border:1px solid var(--line);background:#fbf8f1;border-radius:14px;padding:11px 5px;text-align:center;cursor:pointer}
.item b{font-family:serif;font-size:21px;display:block}
.item small{color:var(--muted);font-size:10px}
.item.active{outline:2px solid var(--gold);background:#fff8e8}
.result{display:none}
.badge{display:inline-block;background:#e9efe9;color:#294236;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}
.result h3{font-family:serif;font-size:32px;margin:10px 0 8px}
.result p{line-height:1.75;font-size:14px;margin:10px 0}
.note{font-size:12px;color:#6f6657;background:#fff7e8;border-left:4px solid var(--gold);padding:11px 12px;border-radius:9px;line-height:1.6}
.topline{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}
.clear{background:#ece8df;color:#333;padding:8px 11px;font-size:12px}
@media(max-width:420px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
  <h1>화담철학관 60갑자</h1>
  <p>일주를 검색하거나 목록에서 선택해 핵심 성향과 해석 포인트를 빠르게 확인하세요.</p>
</section>

<section class="card">
  <h2>일주 검색</h2>
  <div class="search">
    <input id="q" placeholder="예: 갑자, 을미, 신유">
    <button onclick="doSearch()">검색</button>
  </div>
</section>

<section class="card">
  <div class="topline">
    <h2 style="margin:0">60갑자 전체</h2>
    <button class="clear" onclick="showAll()">전체 보기</button>
  </div>
  <div id="grid" class="grid"></div>
</section>

<section id="result" class="card result">
  <span id="badge" class="badge"></span>
  <h3 id="rname"></h3>
  <p id="summary"></p>
  <p id="strengths"></p>
  <p id="caution"></p>
  <div class="note">※ 전통 명리학의 상징을 바탕으로 한 학습용 요약입니다. 실제 사주 해석은 월령, 격국, 용신, 대운·세운 등 전체 명식을 함께 보아야 합니다.</div>
</section>
</div>

function render(list){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  list.forEach(x=>{
    const el=document.createElement('div');
    el.className='item';
    el.dataset.name=x.name;
    el.innerHTML=`<small>${x.no}번</small><b>${x.name}</b>`;
    el.onclick=()=>selectItem(x,el);
    grid.appendChild(el);
  });
}

function selectItem(x,el){
  document.querySelectorAll('.item').forEach(i=>i.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('badge').textContent=`${x.no}번째 일주`;
  document.getElementById('rname').textContent=x.name+'일주';
  document.getElementById('summary').textContent=x.summary;
  document.getElementById('strengths').textContent=x.strengths;
  document.getElementById('caution').textContent=x.caution;
  const r=document.getElementById('result');
  r.style.display='block';
  r.scrollIntoView({behavior:'smooth',block:'start'});
}

function doSearch(){
  const q=document.getElementById('q').value.trim();
  if(!q){render(DATA);return;}
  const exact=DATA.find(x=>x.name===q || x.name+'일주'===q);
  const list=DATA.filter(x=>x.name.includes(q));
  render(list.length?list:DATA);
  if(exact){
    setTimeout(()=>{
      const el=[...document.querySelectorAll('.item')].find(i=>i.dataset.name===exact.name);
      selectItem(exact,el);
    },0);
  } else if(!list.length){
    alert('해당 일주를 찾지 못했습니다. 예: 갑자, 을미, 신유');
  }
}
function showAll(){
  document.getElementById('q').value='';
  render(DATA);
  document.getElementById('result').style.display='none';
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
render(DATA);
</script>
