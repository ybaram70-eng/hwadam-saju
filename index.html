<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>화담철학관 만세력</title>
<style>
:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#232323;--muted:#727272;--green:#20352d;--gold:#d69b27;--line:#e4ddcf;--soft:#f2eee5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:560px;margin:auto;padding:16px}
.hero{background:var(--green);color:white;border-radius:24px;padding:24px 22px;margin-bottom:15px}
.hero h1{margin:0 0 9px;font-size:29px}
.hero p{margin:0;color:#d8e3dd;line-height:1.65;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}
h2{font-size:21px;margin:0 0 17px}
label{display:block;color:var(--muted);font-size:13px;margin:12px 4px 6px}
input,select{width:100%;border:1px solid #d8cebc;background:white;border-radius:14px;padding:14px 13px;font-size:17px;color:#222}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:1.25fr .8fr .8fr;gap:8px}
.radioRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{border:1px solid #d8cebc;background:white;border-radius:14px;padding:12px;text-align:center;font-weight:700}
.seg input{width:auto;margin-right:6px}
button{width:100%;border:0;border-radius:15px;padding:16px;background:var(--green);color:#fff;font-size:18px;font-weight:800;margin-top:16px}
.help{font-size:12px;line-height:1.65;color:#777;margin-top:10px}
.hide{display:none}
.result{display:none}
.titleLine{font-size:20px;font-weight:800;margin-bottom:12px}
.subline{font-size:13px;color:#666;margin-bottom:15px;line-height:1.6}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pillar{border:1px solid #e0d5c2;background:#faf7ef;border-radius:15px;padding:12px 3px;text-align:center}
.pillar small{display:block;color:#777;font-size:11px;margin-bottom:5px}
.pillar b{font-family:serif;font-size:24px}
.info{margin-top:13px;padding:13px 14px;border-radius:14px;background:#f1eee5;font-size:13px;line-height:1.75}
.warn{margin-top:12px;border-left:4px solid var(--gold);padding:10px 12px;background:#fff8e9;border-radius:8px;font-size:12px;line-height:1.65;color:#665432}
.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8eee9;color:#274136;font-size:11px;font-weight:700;margin-right:5px}
</style>
</head>
<body>
<div class="wrap">
<section class="hero">
<h1>화담철학관 만세력</h1>
<p>양력·음력 생년월일을 입력해 기본 간지와 시주를 확인하는 모바일용 만세력입니다.</p>
</section>

<section class="card">
<h2>출생 정보</h2>

<label>양력 / 음력</label>
<div class="radioRow">
<label class="seg"><input type="radio" name="cal" value="solar" checked>양력</label>
<label class="seg"><input type="radio" name="cal" value="lunar">음력</label>
</div>

<div id="leapBox" class="hide">
<label>음력 월 구분</label>
<select id="leap">
<option value="normal">평달</option>
<option value="leap">윤달</option>
</select>
</div>

<label>이름</label>
<input id="name" placeholder="이름" autocomplete="off">

<label>생년월일</label>
<div class="grid3">
<input id="y" inputmode="numeric" maxlength="4" placeholder="1965">
<input id="m" inputmode="numeric" maxlength="2" placeholder="12">
<input id="d" inputmode="numeric" maxlength="2" placeholder="15">
</div>

<label>출생시간</label>
<div class="grid2">
<input id="h" inputmode="numeric" maxlength="2" placeholder="14">
<input id="min" inputmode="numeric" maxlength="2" placeholder="30">
</div>

<button type="button" onclick="calculate()">만세력 보기</button>
<div class="help">지원 범위: 1900년~2050년. 음력은 평달/윤달을 선택할 수 있습니다.</div>
</section>

<section id="result" class="card result">
<div id="title" class="titleLine">사주 결과</div>
<div id="sub" class="subline"></div>

<div class="pillars">
<div class="pillar"><small>년</small><b id="py">-</b></div>
<div class="pillar"><small>월</small><b id="pm">-</b></div>
<div class="pillar"><small>일</small><b id="pd">-</b></div>
<div class="pillar"><small>시</small><b id="ph">-</b></div>
</div>

<div id="info" class="info"></div>
<div class="warn">※ 이 버전의 년·월·일 간지는 기초 확인용입니다. 전문 상담용 절입시각·지역 보정까지 반영한 정밀 만세력은 추가 계산이 필요합니다.</div>
</section>
</div>

<script>
const BASE_YEAR=1900,MAX_YEAR=2050,DAY_DIFF=43;
const SOLAR_DAYS=[31,28,31,30,31,30,31,31,30,31,30,31,29];
const STEMS=["갑","을","병","정","무","기","경","신","임","계"];
const BRANCHES=["자","축","인","묘","진","사","오","미","신","유","술","해"];

const LUNAR_DATA=[2197849277,2193884334,2194016855,2197706061,3267628326,2194017685,2197898837,2193884522,3267758509,2197824861,2193884334,2197842523,3267627597,2193886501,2197839273,2194017109,3267626346,2197826266,2194016605,2197845179,3267626139,2193885771,2197838667,2193884841,3267627732,2197965749,2193883830,2194016603,3271566647,2193884311,2197710422,2193886794,3267759781,2197903017,2194015669,2193883830,3271637166,2193885486,2197912717,2193886357,3267628362,2197908874,2194017129,2194015597,3271639643,2193883741,2193885485,2197826859,3267627669,2197847381,2193886026,2194017109,3271644501,2194015451,2193883739,2197895255,3267626283,2197850779,2193884821,2193884842,3271584490,2194016949,2193884342,2197834414,3267758679,2193884455,2197698342,2194017685,3271587509,2193884522,2194016685,2197837021,3267626158,2193885774,2197835085,2193886501,3271593305,2193886036,2194017642,2197907802,3267758427,2193884315,2197834395,2193885771,3271600935,2193884837,2193884884,2197973877,3267625654,2194016603,2197836983,2193884311,3267626571,2197698378,2194017957,2197849817,3267757485,2193883830,2197838190,2193885486,3267628182,2197835413,2193886538,2194017701,3271567189,2193884524,2197977787,2193883741,3267627309,2197839019,2193885845,2193886026,3271637834,2194017109,2197853533,2193884346,3267758683,2197837143,2193884459,2193885845,3271576469,2193884842,2194016981,2197825205,3267626166,2197842542,2194016855,2193884455,3271448230,2194017683,2193884586,2197830506,3267758445,2197861551,2193884334,2193885773,3271650573,2193886501,2193886546,2197839316,3267758954,2194016621,2197824859,2193884315,3271588439,2193885771,2193885989,2197904165,3267626708,2194016986,2197895350];

function ld(y){return LUNAR_DATA[y-BASE_YEAR]}
function leapMonthOf(data){return (data>>12)&15}

function lunarDays(y,m,isLeap){
const data=ld(y);
if(isLeap&&leapMonthOf(data)===m)return ((data>>16)&1)?30:29;
return ((data>>(12-m))&1)?30:29;
}

function lunarYearDays(y){return (ld(y)>>17)&0x1ff}
function solarLeap(y){return ((ld(y)>>30)&1)>0}

function solarDays(y,m){
return (m===2&&solarLeap(y))?29:SOLAR_DAYS[m-1];
}

function sumLunarYears(y){
let s=0;
for(let yy=BASE_YEAR;yy<=y;yy++)s+=lunarYearDays(yy);
return s;
}

function sumLunarMonths(y,m,isInter){
let s=0;
if(y>=BASE_YEAR&&m>0){
for(let mm=1;mm<=m;mm++)s+=lunarDays(y,mm,false);
if(isInter){
const lp=leapMonthOf(ld(y));
if(lp>0&&lp<m+1)s+=lunarDays(y,lp,true);
}}
return s;
}

function lunarAbs(y,m,d,isInter){
let s=sumLunarYears(y-1)+sumLunarMonths(y,m-1,true)+d;
if(isInter&&leapMonthOf(ld(y))===m)s+=lunarDays(y,m,false);
return s;
}

function sumSolarYears(y){
let s=0;
for(let yy=BASE_YEAR;yy<=y;yy++)s+=solarLeap(yy)?366:365;
return s;
}

function sumSolarMonths(y,m){
let s=0;
for(let mm=1;mm<=m;mm++)s+=solarDays(y,mm);
return s;
}

function solarAbs(y,m,d){
return sumSolarYears(y-1)+sumSolarMonths(y,m-1)+d-DAY_DIFF;
}

function validSolar(y,m,d){
return y>=BASE_YEAR&&y<=MAX_YEAR&&m>=1&&m<=12&&d>=1&&d<=solarDays(y,m);
}

function validLunar(y,m,d,isInter){
if(y<BASE_YEAR||y>MAX_YEAR||m<1||m>12||d<1)return false;
if(isInter&&leapMonthOf(ld(y))!==m)return false;
return d<=lunarDays(y,m,isInter);
}

function lunarToSolar(y,m,d,isInter){
const a=lunarAbs(y,m,d,isInter);
let sy=(a<solarAbs(y+1,1,1))?y:y+1,sm=1,sd=1;
for(let mm=12;mm>=1;mm--){
const b=solarAbs(sy,mm,1);
if(a>=b){sm=mm;sd=a-b+1;break}
}
return {y:sy,m:sm,d:sd};
}

function solarToLunar(y,m,d){
const a=solarAbs(y,m,d);
let ly=(a>=lunarAbs(y,1,1,false))?y:y-1;
let lm=1,lday=1,isInter=false;
const lp=leapMonthOf(ld(ly));

for(let mm=12;mm>=1;mm--){
const normalStart=lunarAbs(ly,mm,1,false);
if(a>=normalStart){
lm=mm;
if(lp===mm){
const leapStart=lunarAbs(ly,mm,1,true);
if(a>=leapStart){
isInter=true;
lday=a-leapStart+1;
}else{
lday=a-normalStart+1;
}
}else{
lday=a-normalStart+1;
}
break;
}}
return {y:ly,m:lm,d:lday,isInter};
}

function gapja(l){
const a=lunarAbs(l.y,l.m,l.d,l.isInter);

const yiS=((l.y+6)-BASE_YEAR)%10;
const yiB=((l.y)-BASE_YEAR)%12;

const mc=l.m+12*(l.y-BASE_YEAR);
const miS=(mc+3)%10;
const miB=(mc+1)%12;

const diS=(a+4)%10;
const diB=(a+2)%12;

return {
year:STEMS[(yiS+10)%10]+BRANCHES[(yiB+12)%12],
month:STEMS[(miS+10)%10]+BRANCHES[(miB+12)%12],
day:STEMS[(diS+10)%10]+BRANCHES[(diB+12)%12],
dayStem:(diS+10)%10
};
}

function hourPillar(dayStem,h){
const branch=Math.floor(((h+1)%24)/2);
const stem=(dayStem*2+branch)%10;
return STEMS[stem]+BRANCHES[branch];
}

function pad(n){
return String(n).padStart(2,"0");
}

function getNum(id){
return parseInt(document.getElementById(id).value,10);
}

function currentCal(){
return document.querySelector('input[name="cal"]:checked').value;
}

document.querySelectorAll('input[name="cal"]').forEach(el=>{
el.addEventListener('change',()=>{
document.getElementById('leapBox').classList.toggle('hide',currentCal()!=="lunar");
});
});

function calculate(){
const name=document.getElementById("name").value.trim()||"고객";
const y=getNum("y");
const m=getNum("m");
const d=getNum("d");
const h=getNum("h");
const mi=getNum("min");

if(!Number.isInteger(h)||h<0||h>23||!Number.isInteger(mi)||mi<0||mi>59){
alert("출생시간을 0~23시, 0~59분으로 입력해 주세요.");
return;
}

let solar,lunar;

if(currentCal()==="solar"){
if(!validSolar(y,m,d)){
alert("양력 생년월일을 확인해 주세요. (1900~2050)");
return;
}
solar={y,m,d};
lunar=solarToLunar(y,m,d);

}else{

const isInter=document.getElementById("leap").value==="leap";

if(!validLunar(y,m,d,isInter)){
const lp=(y>=BASE_YEAR&&y<=MAX_YEAR)?leapMonthOf(ld(y)):0;
alert(isInter&&lp!==m
?`해당 연도의 윤달은 ${lp?lp+"월":"없습니다"}.`
:"음력 생년월일을 확인해 주세요.");
return;
}

lunar={y,m,d,isInter};
solar=lunarToSolar(y,m,d,isInter);
}

const g=gapja(lunar);
const hp=hourPillar(g.dayStem,h);

document.getElementById("title").textContent=name+"님의 기초 만세력";

document.getElementById("py").textContent=g.year;
document.getElementById("pm").textContent=g.month;
document.getElementById("pd").textContent=g.day;
document.getElementById("ph").textContent=hp;

document.getElementById("sub").innerHTML=
`<span class="tag">양력 ${solar.y}.${pad(solar.m)}.${pad(solar.d)}</span>`+
`<span class="tag">음력 ${lunar.y}.${pad(lunar.m)}.${pad(lunar.d)}${lunar.isInter?" 윤달":""}</span>`;

document.getElementById("info").innerHTML=
`출생시간: <b>${pad(h)}:${pad(mi)}</b><br>`+
`년 간지: <b>${g.year}</b> · 월 간지: <b>${g.month}</b> · 일진: <b>${g.day}</b> · 시 간지: <b>${hp}</b><br>`+
`음력 월: ${lunar.isInter?"윤달":"평달"}`;

const r=document.getElementById("result");
r.style.display="block";
r.scrollIntoView({behavior:"smooth"});
}
</script>
</body>
</html>
