<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#20352d"><title>화담철학관 만세력</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#232323;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.w{max-width:680px;margin:auto;padding:14px 14px 60px}.hero{background:#20352d;color:#fff;border-radius:22px;padding:22px 20px;margin-bottom:13px}.hero small{color:#d9c498}.hero h1{margin:5px 0 7px;font:800 29px serif}.hero p{margin:0;color:#dce4df;font-size:13px;line-height:1.6}.card{background:#fffdf8;border:1px solid #e4dccf;border-radius:20px;padding:17px;margin-bottom:13px}.status{padding:11px 12px;border-radius:12px;background:#eaf0eb;color:#294337;margin-bottom:13px;font-size:13px}.err{background:#fff0ee;color:#9e3d33}label{display:block;font-size:12px;color:#6f6b64;margin:10px 3px 5px}input,select,button{width:100%;padding:13px 11px;border:1px solid #d7cdbb;border-radius:12px;background:#fff;font-size:16px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:8px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg label{margin:0;padding:11px;text-align:center;border:1px solid #d7cdbb;border-radius:12px;color:#333;font-weight:700}.seg input{width:auto}button{margin-top:15px;background:#20352d;color:#fff;border:0;font-weight:800}.hide{display:none}.result{display:none}.pillars{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #bdb5a8;margin-top:10px}.p{text-align:center;border-right:1px solid #cfc8bb;background:#fff}.p:last-child{border-right:0}.p small{display:block;background:#efede7;padding:6px 2px;font-weight:800}.p b{display:block;font:900 28px serif;padding:9px 2px 2px}.p em{display:block;font:normal 16px serif;padding:0 2px 9px;color:#666}.info{margin-top:10px;border:1px solid #ddd4c6}.r{display:grid;grid-template-columns:80px 1fr;border-bottom:1px solid #ddd4c6}.r:last-child{border:0}.r b,.r span{padding:8px;font-size:12px;line-height:1.55}.r b{background:#f2eee6}.luck{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px}.lb{min-width:82px;border:1px solid #d8cfbf;border-radius:8px;background:#fff;padding:8px 5px;text-align:center}.lb b{font:800 18px serif}.lb small{display:block;color:#777;font-size:10px;margin-top:3px}.wood{color:#23864a}.fire{color:#d84b3f}.earth{color:#a87822}.metal{color:#555}.water{color:#2774b8}@media(max-width:430px){.w{padding:7px 6px 45px}.card{padding:10px}.p b{font-size:24px}.r{grid-template-columns:68px 1fr}}</style></head><body><main class="w"><section class="hero"><small>和談 · HWADAM</small><h1>화담철학관 만세력</h1><p>사주 원국·십신·공망·대운을 안정적으로 계산합니다.</p></section><div id="st" class="status">정밀 만세력 엔진을 불러오는 중입니다…</div><section class="card"><h2>출생 정보</h2><label>이름</label><input id="name" placeholder="이름"><label>성별</label><select id="gender"><option value="female">여성</option><option value="male">남성</option></select><label>양력 / 음력</label><div class="seg"><label><input type="radio" name="cal" value="solar" checked> 양력</label><label><input type="radio" name="cal" value="lunar"> 음력</label></div><div id="leapBox" class="hide"><label>음력 월 구분</label><select id="leap"><option value="normal">평달</option><option value="leap">윤달</option></select></div><label>생년월일</label><div class="g3"><input id="year" inputmode="numeric" placeholder="1965"><input id="month" inputmode="numeric" placeholder="12"><input id="day" inputmode="numeric" placeholder="14"></div><label>출생시간</label><div class="g2"><input id="hour" inputmode="numeric" placeholder="14"><input id="minute" inputmode="numeric" placeholder="50"></div><label>자시 기준</label><select id="boundary"><option value="midnight">자정 기준</option><option value="jasi">야자시</option><option value="splitJasi">분자시</option></select><button id="go" disabled>사주팔자 계산</button></section><section id="result" class="card result"><h2 id="who">사주 결과</h2><div id="summary" class="status"></div><div class="pillars"><div class="p"><small>시주</small><b id="hP"></b><em id="hH"></em></div><div class="p"><small>일주</small><b id="dP"></b><em id="dH"></em></div><div class="p"><small>월주</small><b id="mP"></b><em id="mH"></em></div><div class="p"><small>년주</small><b id="yP"></b><em id="yH"></em></div></div><div class="info"><div class="r"><b>일간</b><span id="dm"></span></div><div class="r"><b>십신</b><span id="tg"></span></div><div class="r"><b>공망</b><span id="vb"></span></div><div class="r"><b>대운</b><span id="lm"></span></div></div><h3>대운 흐름</h3><div id="luck" class="luck"></div></section></main><script type="module">let M;const $=id=>document.getElementById(id),HS={갑:'甲',을:'乙',병:'丙',정:'丁',무:'戊',기:'己',경:'庚',신:'辛',임:'壬',계:'癸'},HB={자:'子',축:'丑',인:'寅',묘:'卯',진:'辰',사:'巳',오:'午',미:'未',신:'申',유:'酉',술:'戌',해:'亥'};const hj=p=>p?(HS[p[0]]||'')+(HB[p[1]]||''):'';function one(x){if(!x)return'-';if(typeof x==='string')return x;return`${x.stem??'-'} / ${x.branch??'-'}`}async function load(){const urls=['https://cdn.jsdelivr.net/npm/manseryeok@2.0.0/+esm','https://esm.sh/manseryeok@2.0.0?bundle'];for(const u of urls){try{M=await import(u);if(M?.calculateFourPillars){$('st').textContent='정밀 만세력 엔진 준비 완료';$('go').disabled=false;return}}catch(e){console.warn('engine fallback',u,e)}}$('st').className='status err';$('st').textContent='만세력 엔진 연결에 실패했습니다. 잠시 후 새로고침해 주세요.'}load();document.querySelectorAll('input[name=cal]').forEach(x=>x.onchange=()=>{$('leapBox').classList.toggle('hide',document.querySelector('input[name=cal]:checked').value!=='lunar')});$('go').onclick=()=>{try{const y=+$('year').value,m=+$('month').value,d=+$('day').value,h=+$('hour').value,minute=+$('minute').value;if(!y||!m||!d||h<0||h>23||minute<0||minute>59)throw Error('생년월일과 시간을 확인해 주세요.');const lunar=document.querySelector('input[name=cal]:checked').value==='lunar';const r=M.calculateFourPillars({year:y,month:m,day:d,hour:h,minute,isLunar:lunar,isLeapMonth:lunar&&$('leap').value==='leap',dayBoundary:$('boundary').value,gender:$('gender').value});const k=r.toObject();$('who').textContent=($('name').value.trim()||'고객')+'님의 사주팔자';$('summary').textContent=`${lunar?'음력':'양력'} ${y}.${m}.${d} ${String(h).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;for(const [id,p] of [['y',k.year],['m',k.month],['d',k.day],['h',k.hour]]){$(id+'P').textContent=p;$(id+'H').textContent=hj(p)}$('dm').textContent=`${k.day[0]} 일간 · ${M.getHeavenlyStemElement(k.day[0])} · ${M.getHeavenlyStemYinYang(k.day[0])}`;$('tg').textContent=['year','month','day','hour'].map((q,i)=>['년','월','일','시'][i]+': '+one(r.tenGods?.[q])).join(' · ');$('vb').textContent=Array.isArray(r.voidBranches)?r.voidBranches.join(' · '):(r.voidBranches||'-');const lp=r.luckPillars;if(lp){$('lm').innerHTML=`${lp.forward?'순행':'역행'} · ${lp.startAge??'-'}세 시작 · 세밀값 ${lp.startYears??'-'}년 ${lp.startMonths??0}개월 ${lp.startDays??0}일`;$('luck').innerHTML=(lp.pillars||[]).slice(0,10).map(x=>`<div class="lb"><b>${x.korean||''}</b><small>${hj(x.korean||'')}<br>${x.age??''}세</small></div>`).join('')}else{$('lm').textContent='대운 정보 없음';$('luck').innerHTML=''}$('result').style.display='block';$('st').className='status';$('st').textContent='계산 완료';$('result').scrollIntoView({behavior:'smooth'})}catch(e){$('st').className='status err';$('st').textContent='계산 오류: '+(e?.message||String(e))}};</script></body></html>
