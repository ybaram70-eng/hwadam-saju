<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#20352d">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>화담철학관 만세력</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f3efe6;overflow:hidden}
body{position:relative}
iframe{display:block;width:100%;height:100%;border:0;background:#f3efe6;padding-bottom:76px;box-sizing:border-box;transform:translateX(0);opacity:1;transition:transform .30s cubic-bezier(.22,.61,.36,1),opacity .22s ease;will-change:transform,opacity}
iframe.slide-out-left{transform:translateX(-18%);opacity:.18}
iframe.slide-out-right{transform:translateX(18%);opacity:.18}
iframe.slide-in-from-right{transition:none;transform:translateX(22%);opacity:.18}
iframe.slide-in-from-left{transition:none;transform:translateX(-22%);opacity:.18}
.bottomNav{position:fixed;z-index:9999;left:0;right:0;bottom:0;min-height:70px;padding:4px 2px calc(4px + env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border-top:1px solid #ddd8ce;display:grid;grid-template-columns:repeat(6,1fr);box-shadow:0 -3px 14px rgba(0,0,0,.07);backdrop-filter:blur(8px)}
.navItem{border:0;background:transparent;color:#5f5f5f;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 0;cursor:pointer;touch-action:manipulation;border-radius:12px;min-width:0}
.navItem .ico{font-size:21px;line-height:1}.navItem .txt{font-size:10px;font-weight:800;white-space:nowrap;letter-spacing:-.5px}
.navItem.active{color:#b94b1f;background:#fff6ef}.navItem:active{transform:scale(.97)}
@media(min-width:800px){.bottomNav{left:50%;transform:translateX(-50%);max-width:760px;border-left:1px solid #eee7dc;border-right:1px solid #eee7dc;border-radius:16px 16px 0 0}}
@media(prefers-reduced-motion:reduce){iframe{transition:none}}
</style>
</head>
<body>
<iframe id="app" src="/stable.html?v=20260827-ui14" title="화담철학관 만세력"></iframe>
<nav class="bottomNav" aria-label="주요 메뉴">
<button class="navItem active" data-target="home"><span class="ico">⌂</span><span class="txt">홈</span></button>
<button class="navItem" data-target="input"><span class="ico">✎</span><span class="txt">사주입력</span></button>
<button class="navItem" data-target="analysis"><span class="ico">♧</span><span class="txt">화담분석</span></button>
<button class="navItem" data-target="calendar"><span class="ico">▣</span><span class="txt">택일달력</span></button>
<button class="navItem" data-target="journal"><span class="ico">✣</span><span class="txt">화담일지</span></button>
<button class="navItem" data-target="customers"><span class="ico">👥</span><span class="txt">고객목록</span></button>
</nav>
<script>
const f=document.getElementById('app');
const navOrder=['home','input','analysis','calendar','journal','customers'];
let d=null,mode='main',currentTarget='home',transitioning=false;
function setActive(btn){document.querySelectorAll('.navItem').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function addScript(id,src){if(!d.getElementById(id)){const s=d.createElement('script');s.id=id;s.src=src;d.body.appendChild(s)}}
function setupMain(){try{d=f.contentDocument;if(!d)return;addScript('hwadam-ui-polish','/ui-polish.js?v=20260827-2');addScript('hwadam-premium-ui','/premium-ui.js?v=20260826-2');addScript('hwadam-home-dashboard','/home-dashboard.js?v=20260827-5');addScript('hwadam-screen-mode','/screen-mode.js?v=20260827-2');addScript('hwadam-member-autofill','/member-autofill.js?v=20260827-2');addScript('hwadam-progress-status','/progress-status.js?v=20260824-2');addScript('hwadam-twelve-stages','/twelve-stages.js?v=20260823-1');addScript('hwadam-detail-script','/detail-v2.js?v=20260821-1');addScript('hwadam-analysis-script','/analysis-v1.js?v=20260827-1');addScript('hwadam-analysis-strength-fix','/analysis-strength-fix.js?v=20260824-1');addScript('hwadam-analysis-luck-flow','/analysis-luck-flow.js?v=20260824-2');addScript('hwadam-analysis-final-polish','/analysis-final-polish.js?v=20260826-paid1');addScript('hwadam-journal-script','/journal-v1.js?v=20260822-5');addScript('hwadam-journal-lunar-addon','/journal-lunar-addon.js?v=20260822-1');addScript('hwadam-journal-customer-filter','/journal-customer-filter.js?v=20260822-3');addScript('hwadam-journal-recent-click','/journal-recent-click.js?v=20260822-2');addScript('hwadam-journal-save-fix','/journal-save-fix.js?v=20260822-1');addScript('hwadam-journal-current-sync','/journal-current-sync.js?v=20260827-1');addScript('hwadam-journal-core-result-sync','/journal-core-result-sync.js?v=20260827-1');addScript('hwadam-journal-luck-fix','/journal-luck-fix.js?v=20260827-2');addScript('hwadam-journal-analysis-sync','/journal-analysis-sync.js?v=20260824-1');addScript('hwadam-core-selftest','/core-selftest.js?v=20260824-1');addScript('hwadam-release-check','/release-check.js?v=20260824-1')}catch(e){console.error(e)}}
function setupCalendar(){try{const cd=f.contentDocument;if(!cd||!cd.body)return;if(!cd.getElementById('hwadam-calendar-hanja-fix')){const s=cd.createElement('script');s.id='hwadam-calendar-hanja-fix';s.src='/calendar-hanja-fix.js?v=20260827-1';cd.body.appendChild(s)}if(!cd.getElementById('hwadam-calendar-luck-order-fix')){const s=cd.createElement('script');s.id='hwadam-calendar-luck-order-fix';s.src='/calendar-luck-order-fix.js?v=20260826-1';cd.body.appendChild(s)}if(!cd.getElementById('hwadam-calendar-luck-display-fix')){const s=cd.createElement('script');s.id='hwadam-calendar-luck-display-fix';s.src='/calendar-luck-display-fix.js?v=20260826-1';cd.body.appendChild(s)}}catch(e){console.error(e)}}
function loadMain(cb){if(mode!=='main'){mode='main';d=null;f.src='/stable.html?v=20260827-ui14';const once=()=>{f.removeEventListener('load',once);setupMain();if(cb)setTimeout(cb,250)};f.addEventListener('load',once)}else{setupMain();if(cb)cb()}}
function hasResult(){return !!((d?.getElementById('dP')?.textContent||'').trim()&&(d?.getElementById('yP')?.textContent||'').trim())}
function showMode(t){try{d?.defaultView?.hwadamScreenMode?.show(t)}catch{}}
function goSimple(t,done){setupMain();showMode(t);try{d?.defaultView?.scrollTo({top:0,left:0,behavior:'auto'})}catch{}if(done)done()}
function ensureAnalysis(done){setupMain();let n=0;const tryIt=()=>{if(hasResult()){showMode('analysis');if(done)done();return}const m=d?.defaultView?.hwadamMemberAutofill;if(m?.canCalc?.()){m.calculate();waitResult();return}if(n++<18){setTimeout(tryIt,150);return}showMode('input');let hint=d?.getElementById('memberTimeHint');if(!hint){hint=d?.createElement('div');if(hint){hint.id='memberTimeHint';hint.textContent='회원정보는 불러왔습니다. 출생시간만 한 번 입력하고 사주팔자 계산을 눌러주세요. 다음부터 자동으로 표시됩니다.';hint.style.cssText='margin:10px 0;padding:11px 12px;border-radius:12px;background:#fff6df;border:1px solid #e3c779;color:#765712;font-size:13px;line-height:1.6;font-weight:800';d?.getElementById('go')?.insertAdjacentElement('beforebegin',hint)}}if(done)done()};const waitResult=()=>{let k=0;const w=()=>{if(hasResult()){setTimeout(()=>{showMode('analysis');if(done)done()},250);return}if(k++<35)setTimeout(w,180);else{showMode('input');if(done)done()}};w()};tryIt()}
function ensureJournal(done,customers=false){setupMain();if(hasResult()){showMode(customers?'customers':'journal');if(customers)setTimeout(()=>d?.getElementById('journalCustomerButton')?.click(),180);if(done)done();return}const m=d?.defaultView?.hwadamMemberAutofill;if(m?.canCalc?.()){m.calculate();let k=0;const w=()=>{if(hasResult()){showMode(customers?'customers':'journal');if(customers)setTimeout(()=>d?.getElementById('journalCustomerButton')?.click(),180);if(done)done();return}if(k++<35)setTimeout(w,180);else{showMode('input');if(done)done()}};w();return}showMode('input');if(done)done()}
function directionFor(next){const a=navOrder.indexOf(currentTarget),b=navOrder.indexOf(next);return b>=a?'forward':'back'}
function finishSlide(direction){f.classList.remove('slide-out-left','slide-out-right');f.classList.add(direction==='forward'?'slide-in-from-right':'slide-in-from-left');void f.offsetWidth;requestAnimationFrame(()=>{f.classList.remove('slide-in-from-right','slide-in-from-left');setTimeout(()=>{transitioning=false},320)})}
function slideNavigate(target,action){if(transitioning)return;transitioning=true;const direction=directionFor(target);f.classList.remove('slide-in-from-right','slide-in-from-left');f.classList.add(direction==='forward'?'slide-out-left':'slide-out-right');setTimeout(()=>{action(()=>{currentTarget=target;finishSlide(direction)})},180)}
document.querySelectorAll('.navItem').forEach(btn=>btn.onclick=()=>{const t=btn.dataset.target;if(transitioning)return;setActive(btn);if(t==='calendar'){slideNavigate(t,done=>{mode='calendar';d=null;const once=()=>{f.removeEventListener('load',once);setupCalendar();done()};f.addEventListener('load',once);f.src='/calendar-v1.html?v=20260827-luck5'});return}slideNavigate(t,done=>loadMain(()=>{if(t==='analysis')ensureAnalysis(done);else if(t==='journal')ensureJournal(done,false);else if(t==='customers')ensureJournal(done,true);else goSimple(t,done)}))});
f.addEventListener('load',()=>{if(mode==='main'){setupMain();setTimeout(()=>{if(currentTarget==='analysis')ensureAnalysis(()=>{});else showMode(currentTarget)},400)}else if(mode==='calendar')setupCalendar()});
</script>
</body>
</html>
