<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#20352d"><title>화담 택일달력</title><style>*{box-sizing:border-box}body{margin:0;background:#f3efe6;color:#252525;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.w{max-width:760px;margin:auto;padding:8px 7px 90px}.hero{background:#20352d;color:white;border-radius:10px;padding:18px;margin-bottom:9px}.hero small{color:#d8c59b}.hero h1{margin:8px 0 4px;font-size:25px}.hero p{margin:0;font-size:13px}.card{background:#fffdf9;border:1px solid #d6cdbd;border-radius:9px;padding:12px;margin-bottom:9px}h2{font-size:20px;margin:0 0 12px}.status{font-size:12px;padding:9px 11px;margin-bottom:9px;border-radius:8px;background:#e8efe9;color:#20352d}.customer{width:100%;padding:12px;border:1px solid #d4cab8;border-radius:8px;background:#fff;font-size:16px}.who{margin-top:8px;padding:10px;border-radius:8px;background:#f7f1e5;color:#20352d;font-weight:800}.toolbar{display:grid;grid-template-columns:52px 1fr 52px;gap:7px;align-items:center}.toolbar button,.purpose button{border:1px solid #d4cab8;background:#fff;border-radius:8px;padding:11px;font-weight:700}.month{text-align:center;font-size:23px;font-weight:800}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.week div{text-align:center;padding:8px 0;font-size:18px;font-weight:800;color:#555}.day{min-height:74px;border:1px solid #e0d8ca;border-radius:7px;background:white;padding:5px;text-align:left}.day.muted{opacity:.28}.day.today{border:2px solid #b47a25}.day.selected{background:#20352d;color:white;border-color:#20352d}.day b{font-size:16px}.day small{display:block;margin-top:4px;font-size:12px;color:#777}.day .ganji{font-weight:800;font-size:15px;color:#8a4d13}.day.selected small,.day.selected .ganji{color:#fff}.purpose{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.purpose button.active{background:#20352d;color:white;border-color:#20352d}.detail{background:#f7f1e5;border-radius:8px;padding:13px;line-height:1.75}.detail strong{font-size:18px;color:#20352d}.ganjiBig{font-size:23px;font-weight:900;color:#9b5f1d;margin:5px 0}.selectedBanner{background:#e8efe9;border:2px solid #20352d;border-radius:9px;padding:12px;margin-bottom:10px;font-weight:800;color:#20352d}.relbox{margin-top:12px;padding:11px;border:1px solid #d7cdbb;border-radius:8px;background:#fff}.relbox b{color:#20352d}.tag{display:inline-block;margin:4px 4px 0 0;padding:4px 7px;border-radius:999px;background:#eee7d9;font-size:12px}.warn{background:#f7e3df;color:#8c352d}.good{background:#e2efe5;color:#285d36}.rating{margin:12px 0 4px;padding:14px;border-radius:9px;text-align:center;font-weight:900;font-size:21px}.rating.good{background:#dfeee3;color:#245b34;border:1px solid #b8d3be}.rating.normal{background:#f1eadc;color:#72551f;border:1px solid #d9c9a9}.rating.warn{background:#f5dfdb;color:#8a3029;border:1px solid #dfb7b1}.scoreline{font-size:13px;font-weight:700;margin-top:5px}.note{font-size:12px;color:#756b5e;margin-top:10px}@media(max-width:430px){.w{padding:5px 4px 86px}.day{min-height:68px;padding:4px}.purpose{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:23px}}</style></head><body><main class="w"><section class="hero"><small>和談 · HWADAM</small><h1>화담 택일달력</h1><p>저장 고객을 선택하고 날짜별 일진과 원국 관계를 확인합니다.</p></section><div id="engine" class="status">만세력 엔진 연결 중…</div><section class="card"><h2>상담 고객</h2><select id="customer" class="customer"><option value="">고객을 선택해 주세요</option></select><div id="who" class="who">화담일지에 저장된 고객을 불러옵니다.</div></section><section class="card"><div class="toolbar"><button id="prev">‹</button><div class="month" id="month"></div><button id="next">›</button></div><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="days" id="days"></div></section><section class="card" id="resultCard"><div class="selectedBanner" id="selectedBanner"></div><h2>택일 용도</h2><div class="purpose" id="purpose"><button class="active">종합</button><button>계약</button><button>개업</button><button>이사</button><button>결혼</button><button>여행</button></div><h2 style="margin-top:18px">선택 날짜 결과</h2><div class="detail" id="detail"></div><div class="note">※ 개인 판정은 현재 고객 원국의 네 지지와 선택일 일지 사이 육합·충·형·파·해를 비교한 1차 참고 판정입니다. 결혼은 상대방 원국, 이사는 방향 등 추가 조건이 필요하므로 최종 택일로 단정하지 않습니다.</div></section></main><script type="module">const $=x=>document.getElementById(x),now=new Date(),C='hwadam_customers_v1';let M=null,view=new Date(now.getFullYear(),now.getMonth(),1),selected=new Date(now.getFullYear(),now.getMonth(),now.getDate()),purpose='종합',cache={},client=null;const H={갑:'甲',을:'乙',병:'丙',정:'丁',무:'戊',기:'己',경:'庚',신:'辛',임:'壬',계:'癸',자:'子',축:'丑',인:'寅',묘:'卯',진:'辰',사:'巳',오:'午',미:'未',신:'申',유:'酉',술:'戌',해:'亥'};const clash={자:'오',축:'미',인:'신',묘:'유',진:'술',사:'해',오:'자',미:'축',신:'인',유:'묘',술:'진',해:'사'},harm={자:'미',축:'오',인:'사',묘:'진',진:'묘',사:'인',오:'축',미:'자',신:'해',유:'술',술:'유',해:'신'},brk={자:'유',축:'진',인:'해',묘:'오',진:'축',사:'신',오:'묘',미:'술',신:'사',유:'자',술:'미',해:'인'},combine={자:'축',축:'자',인:'해',해:'인',묘:'술',술:'묘',진:'유',유:'진',사:'신',신:'사',오:'미',미:'오'},punishPairs=['자묘','묘자','인사','사인','사신','신사','인신','신인','축술','술축','술미','미술','축미','미축'];const weights={종합:{합:2,충:-3,형:-2,파:-1,해:-1},계약:{합:3,충:-4,형:-3,파:-2,해:-2},개업:{합:3,충:-4,형:-2,파:-2,해:-1},이사:{합:2,충:-4,형:-2,파:-2,해:-2},결혼:{합:4,충:-5,형:-3,파:-2,해:-3},여행:{합:2,충:-3,형:-2,파:-1,해:-2}};function hanja(s){return [...String(s||'')].map(x=>H[x]||x).join('')}function pad(n){return String(n).padStart(2,'0')}function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function label(d){const wd=['日','月','火','水','木','金','土'][d.getDay()];return d.getFullYear()+'年 '+(d.getMonth()+1)+'月 '+d.getDate()+'日 ('+wd+')'}async function loadEngine(){for(const u of ['https://esm.sh/manseryeok@2.0.0?bundle','https://cdn.jsdelivr.net/npm/manseryeok@2.0.0/+esm','https://esm.run/manseryeok@2.0.0']){try{const m=await import(u);if(m?.calculateFourPillars){M=m;$('engine').textContent='✓ 정밀 만세력 엔진 준비 완료';return}}catch(e){}}$('engine').textContent='만세력 엔진 연결이 늦습니다. 잠시 후 새로고침해 주세요.'}function dayGanji(d){if(!M)return '';const k=key(d);if(cache[k])return cache[k];try{return cache[k]=M.calculateFourPillars({year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate(),hour:12,minute:0,isLunar:false,dayBoundary:'midnight',gender:'female'}).toObject().day||''}catch{return ''}}function saved(){try{return JSON.parse(localStorage.getItem(C))||[]}catch{return []}}function fillCustomers(){const a=saved(),q=$('customer');q.innerHTML='<option value="">고객을 선택해 주세요</option>';a.forEach((c,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=(c.name||'이름없음')+' · '+[c.year,c.month,c.day].join('.');q.appendChild(o)});$('who').textContent=a.length?`저장 고객 ${a.length}명 · 고객을 선택하면 개인 택일 비교가 시작됩니다.`:'저장 고객이 없습니다. 먼저 화담일지에서 고객을 저장해 주세요.'}function clientPillars(c){if(!M||!c)return null;try{return M.calculateFourPillars({year:+c.year,month:+c.month,day:+c.day,hour:+(c.hour||12),minute:+(c.minute||0),isLunar:!!c.isLunar,isLeapMonth:!!c.isLeapMonth,dayBoundary:c.dayBoundary||'midnight',gender:c.gender||'female'}).toObject()}catch{return null}}function relation(a,b){const out=[];if(!a||!b)return out;if(combine[a]===b)out.push(['합','good']);if(clash[a]===b)out.push(['충','warn']);if(harm[a]===b)out.push(['해','warn']);if(brk[a]===b)out.push(['파','warn']);if(punishPairs.includes(a+b))out.push(['형','warn']);return out}function personalAnalysis(p,g){const dayBranch=g?.[1];if(!p||!dayBranch)return null;const pillars=[['년',p.year],['월',p.month],['일',p.day],['시',p.hour]].filter(x=>x[1]);let score=0,all=[];for(const [name,val] of pillars){const branch=val?.[1],rels=relation(branch,dayBranch);for(const r of rels){score+=(weights[purpose]?.[r[0]]||0);all.push({pillar:name,branch,type:r[0],cls:r[1]})}}let level='보통',cls='normal';if(score>=2){level='좋은 날';cls='good'}else if(score<=-3){level='주의할 날';cls='warn'}return{score,level,cls,all}}function renderDetail(){const g=dayGanji(selected),text={종합:'일진과 고객 원국의 관계를 함께 확인합니다.',계약:'계약·서명일은 충·형·파·해가 겹치는 날을 더 신중하게 봅니다.',개업:'개업은 원국과 일진의 조화를 우선 확인합니다.',이사:'이사는 원국 관계와 함께 실제 방향 조건도 추가 확인해야 합니다.',결혼:'결혼은 두 사람의 원국을 함께 비교해야 정확도가 높아집니다.',여행:'여행은 출발일의 충·형·해 여부를 우선 참고합니다.'};$('selectedBanner').textContent='✓ '+label(selected)+' 선택됨';let extra='';if(client&&M&&g){const p=clientPillars(client);if(p){const a=personalAnalysis(p,g);extra='<div class="relbox"><b>'+client.name+'님 개인 택일 비교</b><br>원국: '+[p.year,p.month,p.day,p.hour].filter(Boolean).map(hanja).join(' · ')+'<br>선택일 日辰: <b>'+hanja(g)+'</b>';if(a){extra+='<div class="rating '+a.cls+'">'+a.level+'<div class="scoreline">'+purpose+' 기준 1차 관계점수 '+(a.score>0?'+':'')+a.score+'</div></div>';extra+='원국 관계: ';extra+=a.all.length?a.all.map(x=>'<span class="tag '+x.cls+'">'+x.pillar+'支 '+hanja(x.branch+g[1])+' '+x.type+'</span>').join(''):'<span class="tag">직접적인 육합·충·형·파·해 없음</span>'}extra+='</div>'}}else{extra='<div class="relbox"><b>개인별 판정을 보려면 위의 상담 고객을 먼저 선택해 주세요.</b></div>'}$('detail').innerHTML='<strong>'+label(selected)+'</strong><div class="ganjiBig">日辰 '+(g?hanja(g):'계산 중…')+'</div>택일 용도: <b>'+purpose+'</b><br><br>'+text[purpose]+extra}function render(){const y=view.getFullYear(),m=view.getMonth();$('month').textContent=y+'年 '+(m+1)+'月';const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());$('days').innerHTML='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const b=document.createElement('button');b.type='button';b.className='day'+(d.getMonth()!==m?' muted':'')+(key(d)===key(now)?' today':'')+(key(d)===key(selected)?' selected':'');const g=dayGanji(d),wd=['日','月','火','水','木','金','土'][d.getDay()];b.innerHTML='<b>'+d.getDate()+'</b><small>('+wd+')</small><small class="ganji">'+(g?hanja(g):'')+'</small>';b.onclick=()=>{selected=new Date(d.getFullYear(),d.getMonth(),d.getDate());view=new Date(d.getFullYear(),d.getMonth(),1);render();renderDetail();setTimeout(()=>$('resultCard').scrollIntoView({behavior:'smooth',block:'start'}),50)};$('days').appendChild(b)}}$('customer').onchange=()=>{const a=saved(),i=$('customer').value;client=i===''?null:a[+i];$('who').textContent=client?(client.name+'님 · '+[client.year,client.month,client.day].join('.')+' 선택됨'):'고객을 선택해 주세요.';renderDetail()};$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};document.querySelectorAll('#purpose button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#purpose button').forEach(x=>x.classList.remove('active'));b.classList.add('active');purpose=b.textContent.trim();renderDetail()});fillCustomers();render();renderDetail();await loadEngine();render();renderDetail();</script></body></html>
