<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#20352d"><title>화담철학관 만세력</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#232323;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.w{max-width:680px;margin:auto;padding:14px 14px 60px}.hero{background:#20352d;color:#fff;border-radius:22px;padding:22px 20px;margin-bottom:13px}.hero small{color:#d9c498}.hero h1{margin:5px 0 7px;font:800 29px serif}.hero p{margin:0;color:#dce4df;font-size:13px}.card{background:#fffdf8;border:1px solid #e4dccf;border-radius:20px;padding:17px;margin-bottom:13px}.status{padding:11px 12px;border-radius:12px;background:#eaf0eb;color:#294337;margin-bottom:13px;font-size:13px}.err{background:#fff0ee;color:#9e3d33}label{display:block;font-size:12px;color:#6f6b64;margin:10px 3px 5px}input,select,button{width:100%;padding:13px 11px;border:1px solid #d7cdbb;border-radius:12px;background:#fff;font-size:16px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:8px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg label{margin:0;padding:11px;text-align:center;border:1px solid #d7cdbb;border-radius:12px;color:#333;font-weight:700}.seg input{width:auto}button{margin-top:15px;background:#20352d;color:#fff;border:0;font-weight:800}.hide{display:none}.result{display:none}.pillars{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #aaa;margin-top:10px}.p{text-align:center;border-right:1px solid #bbb;background:#fff}.p:last-child{border-right:0}.p small{display:block;background:#efede7;padding:6px 2px;font-weight:800}.p b{display:block;font:900 28px serif;padding:9px 2px 2px}.p em{display:block;font:normal 16px serif;padding:0 2px 9px;color:#666}.info,.detail{margin-top:10px;border:1px solid #d5cdbf}.r{display:grid;grid-template-columns:80px 1fr;border-bottom:1px solid #ddd4c6}.r:last-child{border:0}.r b,.r span{padding:8px;font-size:12px;line-height:1.55}.r b{background:#f2eee6}.sectionTitle{text-align:center;border-top:3px solid #666;padding-top:10px;margin:15px 0 8px}.luck,.years{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}.lb,.yb{min-width:82px;border:1px solid #cfc6b7;border-radius:7px;background:#fff;padding:8px 5px;text-align:center;cursor:pointer}.lb b,.yb b{font:800 18px serif}.lb small,.yb small{display:block;color:#777;font-size:10px;margin-top:3px}.selected{outline:3px solid #294337;background:#edf3ef}.subcard{margin-top:10px;background:#f6f1e8;border:1px solid #ddd2c1;padding:11px;border-radius:10px}.subcard h4{margin:0 0 8px;color:#20352d}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:11px;border:1px solid #d1c6b4;border-radius:999px;padding:5px 8px;background:#fff}.note{font-size:11px;color:#776f65;line-height:1.5;margin-top:7px}@media(max-width:430px){.w{padding:7px 6px 45px}.card{padding:10px}.p b{font-size:24px}.r{grid-template-columns:68px 1fr}}</style></head><body><main class="w"><section class="hero"><small>和談 · HWADAM</small><h1>화담철학관 만세력</h1><p>원국부터 대운·세운까지 한 화면에서 확인합니다.</p></section><div id="st" class="status">만세력 엔진 연결 중…</div><section class="card"><h2>출생 정보</h2><label>이름</label><input id="name" placeholder="이름"><label>성별</label><select id="gender"><option value="female">여성</option><option value="male">남성</option></select><label>양력 / 음력</label><div class="seg"><label><input type="radio" name="cal" value="solar" checked> 양력</label><label><input type="radio" name="cal" value="lunar"> 음력</label></div><div id="leapBox" class="hide"><label>음력 월 구분</label><select id="leap"><option value="normal">평달</option><option value="leap">윤달</option></select></div><label>생년월일</label><div class="g3"><input id="year" inputmode="numeric" placeholder="1965"><input id="month" inputmode="numeric" placeholder="12"><input id="day" inputmode="numeric" placeholder="14"></div><label>출생시간</label><div class="g2"><input id="hour" inputmode="numeric" placeholder="14"><input id="minute" inputmode="numeric" placeholder="50"></div><label>자시 기준</label><select id="boundary"><option value="midnight">자정 기준</option><option value="jasi">야자시</option><option value="splitJasi">분자시</option></select><button id="go" type="button">사주팔자 계산</button></section><section id="result" class="card result"><h2 id="who">사주 결과</h2><div id="summary" class="status"></div><div class="pillars"><div class="p"><small>시주</small><b id="hP"></b><em id="hH"></em></div><div class="p"><small>일주</small><b id="dP"></b><em id="dH"></em></div><div class="p"><small>월주</small><b id="mP"></b><em id="mH"></em></div><div class="p"><small>년주</small><b id="yP"></b><em id="yH"></em></div></div><div class="detail"><div class="r"><b>일간</b><span id="dm"></span></div><div class="r"><b>십신</b><span id="tg"></span></div><div class="r"><b>지장간</b><span id="hidden"></span></div><div class="r"><b>12운성</b><span id="stage"></span></div><div class="r"><b>공망</b><span id="vb"></span></div><div class="r"><b>합·충·형·파·해</b><span id="rel"></span></div><div class="r"><b>신살</b><span id="stars"></span></div></div><h3 class="sectionTitle">대운 흐름</h3><div id="luck" class="luck"></div><div id="luckDetail" class="subcard"><h4>대운 상세</h4><div id="luckText">대운 칸을 누르면 상세가 표시됩니다.</div></div><h3 class="sectionTitle">세운</h3><div id="years" class="years"></div><div id="yearDetail" class="subcard"><h4>세운 상세</h4><div id="yearText">연도를 누르면 해당 세운을 확인합니다.</div></div></section></main><script type="module">let M,loading,lastR;const $=id=>document.getElementById(id),HS={갑:'甲',을:'乙',병:'丙',정:'丁',무:'戊',기:'己',경:'庚',신:'辛',임:'壬',계:'癸'},HB={자:'子',축:'丑',인:'寅',묘:'卯',진:'辰',사:'巳',오:'午',미:'未',신:'申',유:'酉',술:'戌',해:'亥'};const HIDDEN={자:'계',축:'기·계·신',인:'갑·병·무',묘:'을',진:'무·을·계',사:'병·무·경',오:'정·기',미:'기·정·을',신:'경·임·무',유:'신',술:'무·신·정',해:'임·갑'};const hj=p=>p?(HS[p[0]]||'')+(HB[p[1]]||''):'';function one(x){if(!x)return'-';if(typeof x==='string')return x;return`${x.stem??'-'} / ${x.branch??'-'}`}function timedImport(u){return Promise.race([import(u),new Promise((_,rej)=>setTimeout(()=>rej(Error('timeout')),4500))])}async function load(){if(M)return M;if(loading)return loading;loading=(async()=>{for(const u of ['https://esm.sh/manseryeok@2.0.0?bundle','https://cdn.jsdelivr.net/npm/manseryeok@2.0.0/+esm','https://esm.run/manseryeok@2.0.0']){try{const mod=await timedImport(u);if(mod?.calculateFourPillars){M=mod;$('st').className='status';$('st').textContent='정밀 만세력 엔진 준비 완료';return M}}catch(e){}}throw Error('만세력 엔진 연결 실패')})();try{return await loading}finally{loading=null}}function relations(bs){const a=[];const pairs=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];const clash={자:'오',축:'미',인:'신',묘:'유',진:'술',사:'해',오:'자',미:'축',신:'인',유:'묘',술:'진',해:'사'},harm={자:'미',축:'오',인:'사',묘:'진',진:'묘',사:'인',오:'축',미:'자',신:'해',유:'술',술:'유',해:'신'},breaks={자:'유',축:'진',인:'해',묘:'오',진:'축',사:'신',오:'묘',미:'술',신:'사',유:'자',술:'미',해:'인'};for(const [i,j] of pairs){if(clash[bs[i]]===bs[j])a.push(bs[i]+bs[j]+'충');if(harm[bs[i]]===bs[j])a.push(bs[i]+bs[j]+'해');if(breaks[bs[i]]===bs[j])a.push(bs[i]+bs[j]+'파')}return a.length?a.join(' · '):'두드러진 충·파·해 없음'}function stageApprox(dayStem,branches){return branches.map(b=>b+'지').join(' · ')+' (12운성 정밀표 확장 예정)'}function starsApprox(){return '신살은 원국·일간 기준 정밀 판정 확장 예정'}function makeYears(base){$('years').innerHTML='';for(let y=base;y<base+10;y++){const d=document.createElement('div');d.className='yb';d.innerHTML=`<b>${y}</b><small>세운</small>`;d.onclick=()=>{document.querySelectorAll('.yb').forEach(x=>x.classList.remove('selected'));d.classList.add('selected');$('yearText').innerHTML=`<b>${y}년</b><br>세운 간지·십신·12운성·신살·합충 상세를 이 영역에 연결합니다.`};$('years').appendChild(d)}}load().catch(()=>{$('st').className='status err';$('st').textContent='연결이 늦습니다. 계산 버튼을 누르면 다시 연결합니다.'});document.querySelectorAll('input[name=cal]').forEach(x=>x.onchange=()=>{$('leapBox').classList.toggle('hide',document.querySelector('input[name=cal]:checked').value!=='lunar')});$('go').onclick=async()=>{try{$('go').disabled=true;$('go').textContent='계산 중…';if(!M)await load();const y=+$('year').value,m=+$('month').value,d=+$('day').value,h=+$('hour').value,minute=+$('minute').value;if(!y||!m||!d||h<0||h>23||minute<0||minute>59)throw Error('생년월일과 시간을 확인해 주세요.');const lunar=document.querySelector('input[name=cal]:checked').value==='lunar';const r=M.calculateFourPillars({year:y,month:m,day:d,hour:h,minute,isLunar:lunar,isLeapMonth:lunar&&$('leap').value==='leap',dayBoundary:$('boundary').value,gender:$('gender').value});lastR=r;const k=r.toObject();$('who').textContent=($('name').value.trim()||'고객')+'님의 사주팔자';$('summary').textContent=`${lunar?'음력':'양력'} ${y}.${m}.${d} ${String(h).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;for(const [id,p] of [['y',k.year],['m',k.month],['d',k.day],['h',k.hour]]){$(id+'P').textContent=p;$(id+'H').textContent=hj(p)}$('dm').textContent=`${k.day[0]} 일간 · ${M.getHeavenlyStemElement(k.day[0])} · ${M.getHeavenlyStemYinYang(k.day[0])}`;$('tg').textContent=['year','month','day','hour'].map((q,i)=>['년','월','일','시'][i]+': '+one(r.tenGods?.[q])).join(' · ');const ps=[k.hour,k.day,k.month,k.year];$('hidden').textContent=ps.map((p,i)=>['시','일','월','년'][i]+': '+(HIDDEN[p?.[1]]||'-')).join(' · ');$('stage').textContent=stageApprox(k.day[0],ps.map(p=>p?.[1]));$('vb').textContent=Array.isArray(r.voidBranches)?r.voidBranches.join(' · '):(r.voidBranches||'-');$('rel').textContent=relations(ps.map(p=>p?.[1]));$('stars').textContent=starsApprox();const lp=r.luckPillars;$('luck').innerHTML='';if(lp){(lp.pillars||[]).slice(0,10).forEach(x=>{const e=document.createElement('div');e.className='lb';e.innerHTML=`<b>${x.korean||''}</b><small>${hj(x.korean||'')}<br>${x.age??''}세</small>`;e.onclick=()=>{document.querySelectorAll('.lb').forEach(z=>z.classList.remove('selected'));e.classList.add('selected');$('luckText').innerHTML=`<b>${x.age??''}세 ${x.korean||''} 대운</b><br>한자 ${hj(x.korean||'')}<br>이 대운의 십신·12운성·신살·원국 합충을 순서대로 확장 표시합니다.`};$('luck').appendChild(e)})}makeYears(new Date().getFullYear());$('result').style.display='block';$('st').className='status';$('st').textContent='계산 완료';$('result').scrollIntoView({behavior:'smooth'})}catch(e){$('st').className='status err';$('st').textContent='계산 오류: '+(e?.message||String(e))}finally{$('go').disabled=false;$('go').textContent='사주팔자 계산'}};</script></body></html>
