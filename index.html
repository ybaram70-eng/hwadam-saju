<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#20352d">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>화담철학관 만세력</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f3efe6;overflow:hidden}body{position:relative}iframe{display:block;width:100%;height:100%;border:0;background:#f3efe6;padding-bottom:76px;box-sizing:border-box;transform:translateX(0);opacity:1;transition:transform .30s cubic-bezier(.22,.61,.36,1),opacity .22s ease;will-change:transform,opacity}.bottomNav{position:fixed;z-index:9999;left:0;right:0;bottom:0;min-height:70px;padding:4px 2px calc(4px + env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border-top:1px solid #ddd8ce;display:grid;grid-template-columns:repeat(6,1fr);box-shadow:0 -3px 14px rgba(0,0,0,.07)}.navItem{border:0;background:transparent;color:#5f5f5f;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 0;border-radius:12px;min-width:0}.navItem .ico{font-size:21px}.navItem .txt{font-size:10px;font-weight:800;white-space:nowrap}.navItem.active{color:#b94b1f;background:#fff6ef}
</style>
</head><body>
<iframe id="app" src="/stable.html?v=20260828-ui21" title="화담철학관 만세력"></iframe>
<nav class="bottomNav"><button class="navItem active" data-target="home"><span class="ico">⌂</span><span class="txt">홈</span></button><button class="navItem" data-target="input"><span class="ico">✎</span><span class="txt">사주입력</span></button><button class="navItem" data-target="analysis"><span class="ico">♧</span><span class="txt">화담분석</span></button><button class="navItem" data-target="calendar"><span class="ico">▣</span><span class="txt">택일달력</span></button><button class="navItem" data-target="journal"><span class="ico">✣</span><span class="txt">화담일지</span></button><button class="navItem" data-target="customers"><span class="ico">👥</span><span class="txt">고객목록</span></button></nav>
<script>
const f=document.getElementById('app'),navOrder=['home','input','analysis','calendar','journal','customers'];let d=null,mode='main',currentTarget='home',transitioning=false;
function setActiveTarget(t){document.querySelectorAll('.navItem').forEach(x=>x.classList.toggle('active',x.dataset.target===t));currentTarget=t}
function addScript(id,src){if(!d.getElementById(id)){const s=d.createElement('script');s.id=id;s.src=src;d.body.appendChild(s)}}
function setupMain(){try{d=f.contentDocument;if(!d)return;addScript('hwadam-ui-polish','/ui-polish.js?v=20260827-2');addScript('hwadam-premium-ui','/premium-ui.js?v=20260826-2');addScript('hwadam-home-dashboard','/home-dashboard.js?v=20260827-5');addScript('hwadam-signup-calendar','/signup-calendar-ui.js?v=20260827-1');addScript('hwadam-screen-mode','/screen-mode.js?v=20260827-2');addScript('hwadam-member-autofill','/member-autofill.js?v=20260827-4');addScript('hwadam-pillar-hanja-view','/pillar-hanja-view.js?v=20260828-6');addScript('hwadam-relation-display-fix','/relation-display-fix.js?v=20260828-4');addScript('hwadam-progress-status','/progress-status.js?v=20260824-2');addScript('hwadam-twelve-stages','/twelve-stages.js?v=20260823-1');addScript('hwadam-detail-script','/detail-v2.js?v=20260821-1');addScript('hwadam-analysis-script','/analysis-v1.js?v=20260827-1');addScript('hwadam-analysis-strength-fix','/analysis-strength-fix.js?v=20260824-1');addScript('hwadam-analysis-luck-flow','/analysis-luck-flow.js?v=20260824-2');addScript('hwadam-analysis-final-polish','/analysis-final-polish.js?v=20260826-paid1');addScript('hwadam-journal-script','/journal-v1.js?v=20260822-5');addScript('hwadam-journal-lunar-addon','/journal-lunar-addon.js?v=20260822-1');addScript('hwadam-journal-customer-filter','/journal-customer-filter.js?v=20260822-3');addScript('hwadam-journal-recent-click','/journal-recent-click.js?v=20260822-2');addScript('hwadam-journal-save-fix','/journal-save-fix.js?v=20260822-1');addScript('hwadam-journal-current-sync','/journal-current-sync.js?v=20260827-1');addScript('hwadam-journal-core-result-sync','/journal-core-result-sync.js?v=20260827-1');addScript('hwadam-journal-luck-fix','/journal-luck-fix.js?v=20260827-2');addScript('hwadam-journal-analysis-sync','/journal-analysis-sync.js?v=20260824-1')}catch(e){}}
function setupCalendar(){try{const cd=f.contentDocument;if(!cd)return;['calendar-hanja-fix.js?v=20260827-1','calendar-luck-order-fix.js?v=20260826-1','calendar-luck-display-fix.js?v=20260826-1'].forEach((src,i)=>{const id='calfix'+i;if(!cd.getElementById(id)){const s=cd.createElement('script');s.id=id;s.src='/'+src;cd.body.appendChild(s)}})}catch{}}
function loadMain(cb){if(mode!=='main'){mode='main';d=null;const once=()=>{f.removeEventListener('load',once);setupMain();setTimeout(()=>cb&&cb(),260)};f.addEventListener('load',once);f.src='/stable.html?v=20260828-ui21'}else{setupMain();cb&&cb()}}
function hasResult(){return !!((d?.getElementById('dP')?.textContent||'').trim()&&(d?.getElementById('yP')?.textContent||'').trim())}
function showMode(t){try{d?.defaultView?.hwadamScreenMode?.show(t);d?.defaultView?.scrollTo({top:0,left:0,behavior:'auto'})}catch{}}
function fallbackInput(done){setActiveTarget('input');showMode('input');done&&done()}
function ensureAnalysis(done){setupMain();setActiveTarget('analysis');let tries=0;const attempt=()=>{if(hasResult()){showMode('analysis');done&&done();return}const m=d?.defaultView?.hwadamMemberAutofill;if(m?.canCalc?.()){m.calculate();let k=0;const wait=()=>{if(hasResult()){showMode('analysis');done&&done();return}if(k++<45){setTimeout(wait,180);return}fallbackInput(done)};wait();return}if(tries++<20){setTimeout(attempt,150);return}fallbackInput(done)};attempt()}
function ensureJournal(done,customers=false){if(!hasResult()){fallbackInput(done);return}showMode(customers?'customers':'journal');if(customers)setTimeout(()=>d?.getElementById('journalCustomerButton')?.click(),180);done&&done()}
function goSimple(t,done){showMode(t);done&&done()}
function directionFor(next){return navOrder.indexOf(next)>=navOrder.indexOf(currentTarget)?'forward':'back'}
function finishSlide(){f.style.transform='';f.style.opacity='1';setTimeout(()=>transitioning=false,260)}
function slideNavigate(target,action){if(transitioning)return;transitioning=true;const dir=directionFor(target);f.style.transform=dir==='forward'?'translateX(-12%)':'translateX(12%)';f.style.opacity='.35';setTimeout(()=>action(finishSlide),150)}
document.querySelectorAll('.navItem').forEach(btn=>btn.onclick=()=>{const t=btn.dataset.target;if(transitioning)return;setActiveTarget(t);if(t==='calendar'){slideNavigate(t,done=>{mode='calendar';d=null;const once=()=>{f.removeEventListener('load',once);setupCalendar();done()};f.addEventListener('load',once);f.src='/calendar-v1.html?v=20260827-luck5'});return}slideNavigate(t,done=>loadMain(()=>{if(t==='analysis')ensureAnalysis(done);else if(t==='journal')ensureJournal(done,false);else if(t==='customers')ensureJournal(done,true);else goSimple(t,done)}))});
f.addEventListener('load',()=>{if(mode==='main'){setupMain();setTimeout(()=>{if(currentTarget==='analysis')ensureAnalysis(()=>{});else showMode(currentTarget)},420)}else setupCalendar()});
</script></body></html>
