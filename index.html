<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#20352d"><title>화담철학관 만세력</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1e8}iframe{display:block;width:100%;height:100%;border:0;background:#f5f1e8}</style></head><body><iframe id="app" src="/app.html?v=20260818-4" title="화담철학관 만세력"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;const st=d.createElement('style');st.textContent='.db .dd{display:none!important}.db.active .dd{display:none!important}.hj-sec{margin-top:20px;padding:17px;border:2px solid #20352d;border-radius:18px;background:#fffdf8}.hj-sec h3{margin:0 0 10px}.hj-out{display:none;margin-top:12px}.hj-part{padding:14px;margin:9px 0;border-radius:13px;background:#f3efe7;font-size:13px;line-height:1.9}.hj-part b{display:block;color:#20352d;font-size:15px;margin-bottom:5px}.hj-head{padding:14px;border-radius:14px;background:#20352d;color:#fff;line-height:1.8;margin-bottom:10px}.hj-key{display:inline-block;padding:4px 7px;margin:2px;border-radius:8px;background:#e7eee9;color:#20352d;font-size:11px}.hj-sub{color:#7a684c;font-weight:700}';d.head.appendChild(st);function show(card){if(!card)return;d.querySelectorAll('.db').forEach(x=>x.classList.remove('active'));card.classList.add('active');let box=d.getElementById('selectedDayDetail');if(!box){box=d.createElement('div');box.id='selectedDayDetail';box.className='summary';box.style.cssText='margin:12px 0 14px;padding:14px;border:3px solid #20352d;border-radius:13px;background:#edf3ef;font-size:14px;line-height:1.8;color:#232323';const s=d.getElementById('daySummary');if(s)s.insertAdjacentElement('afterend',box)}const detail=card.querySelector('.dd');box.innerHTML='<b style="font-size:16px">선택한 날짜 상세</b><br>'+(detail?detail.innerHTML:card.innerHTML);box.style.display='block';setTimeout(()=>box.scrollIntoView({behavior:'smooth',block:'center'}),30)}function pick(e){const c=e.target&&e.target.closest?e.target.closest('.db'):null;if(c){e.preventDefault();e.stopPropagation();show(c)}}d.addEventListener('click',pick,true);d.addEventListener('touchend',pick,true);d.addEventListener('pointerup',pick,true);function txt(id){return(d.getElementById(id)?.textContent||'').trim()}function activeText(sel){return(d.querySelector(sel)?.textContent||'').replace(/\s+/g,' ').trim()}function countEl(s){const o={목:0,화:0,토:0,금:0,수:0};(s.match(/\((목|화|토|금|수)\)/g)||[]).forEach(x=>o[x[1]]++);return o}function maxKeys(o){let m=Math.max(...Object.values(o));return Object.keys(o).filter(k=>o[k]===m)}function minKeys(o){let m=Math.min(...Object.values(o));return Object.keys(o).filter(k=>o[k]===m)}function monthSeason(p){const b=(p||'').slice(-1);if(['인','묘','진'].includes(b))return'봄의 목 기운';if(['사','오','미'].includes(b))return'여름의 화 기운';if(['신','유','술'].includes(b))return'가을의 금 기운';if(['해','자','축'].includes(b))return'겨울의 수 기운';return'계절 기운'}function stemInfo(s){return({갑:['큰 나무','성장·개척·원칙','곧게 뻗는 힘이 장점이지만 지나치면 고집과 직선성이 될 수 있습니다.'],을:['풀과 덩굴','유연·조율·관계','부드럽게 길을 찾는 힘이 장점이며, 지나치면 눈치를 많이 보거나 결정을 미룰 수 있습니다.'],병:['태양','표현·확장·추진','밝게 드러내고 사람을 모으는 힘이 있으나 과하면 성급함과 소진으로 나타날 수 있습니다.'],정:['등불','집중·감각·세밀함','작지만 오래 비추는 집중력이 강하며, 과하면 예민함과 생각 과다로 흐를 수 있습니다.'],무:['큰 산','중심·책임·신뢰','버티고 지키는 힘이 강하나, 과하면 변화에 늦거나 혼자 짐을 많이 질 수 있습니다.'],기:['논밭','실용·관리·돌봄','현실 감각과 관리력이 좋으며, 과하면 걱정과 지나친 책임감으로 이어질 수 있습니다.'],경:['큰 쇠','결단·실행·정리','끊고 세우는 힘이 강하나, 과하면 말과 판단이 날카로워질 수 있습니다.'],신:['보석','정교·기준·완성','섬세한 기준과 완성도가 장점이며, 과하면 완벽주의와 민감함으로 나타날 수 있습니다.'],임:['큰 물','확장·변화·활동','판을 넓게 보고 흐름을 타는 힘이 좋으나, 과하면 방향이 분산될 수 있습니다.'],계:['비와 이슬','관찰·직관·적응','세밀한 감각과 정보력이 좋으며, 과하면 불안과 생각의 순환이 길어질 수 있습니다.']}[s]||['일간','자기 중심','일간의 성질을 기준으로 전체 균형을 봅니다.'])}function godNote(tg){let a=[];if(/비견/.test(tg))a.push('비견: 자립심·동료·경쟁');if(/겁재/.test(tg))a.push('겁재: 승부·확장·분배');if(/식신/.test(tg))a.push('식신: 생산·생활력·꾸준한 결과');if(/상관/.test(tg))a.push('상관: 표현·기획·변화·규칙 돌파');if(/편재/.test(tg))a.push('편재: 사업·유통·큰돈의 흐름·대인 확장');if(/정재/.test(tg))a.push('정재: 안정 수입·관리·축적');if(/편관/.test(tg))a.push('편관: 압박·책임·승부·통솔');if(/정관/.test(tg))a.push('정관: 직위·신뢰·조직·원칙');if(/편인/.test(tg))a.push('편인: 직관·전문성·비정형 학습');if(/정인/.test(tg))a.push('정인: 문서·학습·보호·자격');return a}function addFortune(){if(d.getElementById('hwadamFortune'))return;const result=d.getElementById('result');if(!result)return;const sec=d.createElement('div');sec.id='hwadamFortune';sec.className='hj-sec';sec.innerHTML='<h3>화담 사주풀이</h3><div class="summary">원국 → 월령과 오행 → 십신 → 재물·직업·관계 → 대운·세운·월운 순서로 상담식으로 풀이합니다.</div><button type="button" id="fortuneBtn">철학관식 종합 사주풀이 보기</button><div id="fortuneOut" class="hj-out"></div>';result.appendChild(sec);d.getElementById('fortuneBtn').addEventListener('click',()=>{const dm=txt('dm'),el=txt('el'),tg=txt('tg'),rel=txt('relations'),who=txt('who');if(!dm){alert('먼저 사주팔자 계산을 해주세요.');return}const y=txt('yP'),m=txt('mP'),day=txt('dP'),h=txt('hP'),stem=dm.charAt(0),si=stemInfo(stem),cnt=countEl(el),strong=maxKeys(cnt),weak=minKeys(cnt),gods=godNote(tg),season=monthSeason(m),luck=activeText('.lb.active'),annual=activeText('.ab.active'),month=activeText('.mb.active'),dayNow=activeText('.db.active');let strength='오행 수치만으로 신강·신약을 단정할 수는 없습니다.';if(cnt[si[0]==='큰 나무'||si[0]==='풀과 덩굴'?'목':si[0]==='태양'||si[0]==='등불'?'화':si[0]==='큰 산'||si[0]==='논밭'?'토':si[0]==='큰 쇠'||si[0]==='보석'?'금':'수']>=2)strength+=' 다만 일간과 같은 오행의 뿌리가 적지 않아 자기 힘이 살아 있는 편으로 볼 여지가 있습니다.';const wealth=/편재|정재/.test(tg)?'원국에 재성이 드러납니다. 재물은 돈을 버는 능력만이 아니라 거래, 고객, 계약, 자산 관리와 연결해 봅니다. 특히 편재가 있으면 한 번에 큰 흐름을 다루는 사업·영업·유통 감각이, 정재가 있으면 안정적 수입과 축적·관리 성향이 강조됩니다. 재성이 강해질 때는 수입 확대와 함께 현금흐름·부채·고정비 관리가 반드시 같이 가야 합니다.':'재성이 겉으로 강하게 드러나지 않더라도 재물운이 없다는 뜻은 아닙니다. 식상으로 생산하고 관성으로 직위를 만들거나 인성으로 전문성을 쌓아 재물을 만드는 구조도 있으므로 대운에서 재성이 들어오는 시점을 함께 봐야 합니다.';const work=/편관|정관/.test(tg)?'관성이 확인되어 책임, 직위, 조직, 제도와 인연이 있습니다. 조직 안에서는 권한과 책임이 커질수록 역량이 드러나기 쉽고, 사업에서도 규정·계약·관리 체계를 갖출수록 안정됩니다.':/식신|상관/.test(tg)?'식상이 확인되어 말, 설명, 영업, 콘텐츠, 생산, 기획처럼 자신의 능력을 밖으로 꺼내는 일이 중요합니다. 고객을 상대하거나 전문지식을 전달해 성과로 바꾸는 업에서 강점이 나타나기 쉽습니다.':'직업은 한 십신만으로 정하지 않습니다. 월령, 관성·식상·재성의 연결과 대운을 함께 보아 조직형인지 사업형인지 판단하는 것이 좋습니다.';const relation=/합|충|형|파|해/.test(rel)?'원국에 합·충·형·파·해가 있으므로 인간관계나 환경 변화가 비교적 정적으로만 흘러가기보다 특정 시점에 크게 움직일 수 있습니다. 합은 묶이고 협력하는 힘, 충은 이동·변화·갈등, 형은 반복되는 긴장, 파·해는 관계나 계획의 미세한 균열로 봅니다. 실제 사건은 대운·세운에서 같은 글자가 다시 들어올 때 체감이 커집니다.':'원국에서 강한 충돌 구조가 두드러지지 않는다면 기본적으로는 한 방향을 오래 유지하는 힘이 있을 수 있습니다. 다만 실제 변화 시점은 대운·세운을 함께 봐야 합니다.';const out=d.getElementById('fortuneOut');out.innerHTML='<div class="hj-head"><b style="font-size:17px">'+who+' 종합 상담</b><br>년주 '+y+' · 월주 '+m+' · 일주 '+day+' · 시주 '+h+'<br><span style="font-size:12px;opacity:.9">원국을 먼저 보고 운의 흐름은 그 다음에 해석합니다.</span></div><div class="hj-part"><b>① 첫인상과 일간의 본성</b>일간은 <span class="hj-sub">'+stem+'</span>으로, '+si[0]+'에 비유합니다. 기본 키워드는 <span class="hj-sub">'+si[1]+'</span>입니다. '+si[2]+' 사주 상담에서는 이 성향이 월령과 주변 오행에 의해 얼마나 힘을 얻고 있는지를 다음 단계에서 봅니다.</div><div class="hj-part"><b>② 월령·계절과 원국의 중심</b>월주는 <span class="hj-sub">'+m+'</span>이고, 계절로는 '+season+'의 영향을 받습니다. 월령은 사주 전체의 기후와 힘의 배분을 판단할 때 매우 중요한 기준입니다. 현재 오행 분포에서 상대적으로 강하게 보이는 기운은 <span class="hj-sub">'+strong.join('·')+'</span>, 적게 보이는 기운은 <span class="hj-sub">'+weak.join('·')+'</span>입니다. '+strength+'</div><div class="hj-part"><b>③ 오행 균형과 용신을 보는 방향</b>현재 표시된 오행은 '+el+'입니다. 용신은 단순히 부족한 오행을 채우는 방식으로 정하지 않고, 월령의 기세·일간의 강약·조후·통관을 함께 봐야 합니다. 따라서 이 화면에서는 <span class="hj-sub">강한 기운을 더 키울지, 강한 기운을 설기·제어할지</span>를 우선 판단하는 방향이 안전합니다. 격국과 용신은 다음 고급 단계에서 별도 판정 기능으로 확장하는 것이 적절합니다.</div><div class="hj-part"><b>④ 십신 구조 — 내가 세상과 관계 맺는 방식</b>'+tg+'<br><br>'+gods.map(x=>'<span class="hj-key">'+x+'</span>').join(' ')+'<br><br>십신은 좋고 나쁨 자체보다 어느 기능이 반복되고 어디로 연결되는지가 중요합니다. 비겁→식상→재성으로 이어지면 자기 힘을 성과와 돈으로 바꾸는 흐름, 재성→관성으로 이어지면 성과가 직위와 책임으로 연결되는 흐름, 관성→인성으로 이어지면 조직·자격·전문성의 힘이 커지는 흐름으로 봅니다.</div><div class="hj-part"><b>⑤ 재물운 — 돈을 버는 힘과 지키는 힘</b>'+wealth+' 재물운을 실제 상담할 때는 “돈이 들어오는가”와 “돈이 남는가”를 분리해서 봅니다. 비겁이 강하면 분배·경쟁 비용, 식상이 강하면 활동비·확장비, 재성이 강하면 투자·거래 규모가 커질 수 있으므로 현금흐름 관리가 핵심입니다.</div><div class="hj-part"><b>⑥ 직업·사업운 — 조직형인가 사업형인가</b>'+work+' 상담에서는 현재 직업 자체보다 <span class="hj-sub">내가 사람을 상대해 성과를 만드는 형인지, 시스템을 관리하는 형인지, 전문성을 축적하는 형인지</span>를 구분해서 봅니다. 대운에서 재성·관성·식상이 들어오는 시기에 역할 변화, 승진, 독립, 사업 확대가 나타나기 쉽습니다.</div><div class="hj-part"><b>⑦ 인간관계·배우자·동업</b>'+relation+' 배우자운이나 동업운은 재성·관성만 단독으로 보지 않고 일지와 합충, 그리고 대운·세운이 일지를 건드리는지를 함께 보는 것이 중요합니다. 특히 큰 계약이나 동업은 운이 좋아도 문서와 권한 배분을 명확히 하는 것이 필요합니다.</div><div class="hj-part"><b>⑧ 건강과 생활 리듬</b>명리에서 건강은 의료 진단이 아니라 오행의 과다·부족에 따른 생활 경향을 참고하는 수준으로 봅니다. 특정 오행이 지나치게 강하거나 약할 때 생활 리듬이 한쪽으로 치우칠 수 있으므로 수면, 식사, 운동, 스트레스 관리처럼 실제 생활에서 조절 가능한 부분을 우선 보는 것이 좋습니다.</div><div class="hj-part"><b>⑨ 대운 — 10년의 큰 환경</b>'+(luck?'현재 선택한 대운은 <span class="hj-sub">'+luck+'</span>입니다. 원국에 이 대운의 천간·지지가 들어왔을 때 무엇을 생하고 무엇을 극하는지, 그리고 원국의 합충을 다시 자극하는지를 봅니다.':'위의 대운 칸을 하나 선택하면 그 대운을 기준으로 더 구체적으로 상담할 수 있습니다.')+' 대운은 사건 하나보다 10년 동안 반복되는 환경과 역할의 변화를 보는 틀입니다.</div><div class="hj-part"><b>⑩ 세운 — 올해와 특정 연도의 사건성</b>'+(annual?'현재 선택한 세운은 <span class="hj-sub">'+annual+'</span>입니다. 대운이 큰 무대라면 세운은 그 해 실제로 움직이는 사건의 성격입니다. 원국과 대운에서 이미 만들어진 흐름을 세운이 현실화시키는 방식으로 봅니다.':'위의 세운 연도를 선택하면 해당 연도의 흐름을 함께 볼 수 있습니다.')+'</div><div class="hj-part"><b>⑪ 월운 — 실제 행동 시기</b>'+(month?'현재 선택한 월운은 <span class="hj-sub">'+month+'</span>입니다. 월운은 계약, 이동, 영업, 관계 변화처럼 실제 행동 시점을 좁힐 때 활용합니다. 세운과 같은 오행이 반복되면 해당 주제가 더 강하게 체감될 수 있습니다.':'세운을 고른 뒤 월운을 선택하면 실제 행동 시기를 더 세밀하게 볼 수 있습니다.')+'</div><div class="hj-part"><b>⑫ 일진 — 하루의 미세한 흐름</b>'+(dayNow?'현재 선택한 일진은 <span class="hj-sub">'+dayNow+'</span>입니다. 일진은 큰 결정을 대신하는 기준이 아니라 이미 잡힌 일정 안에서 컨디션과 관계 흐름을 세밀하게 참고하는 용도로 보는 것이 적절합니다.':'월운에서 날짜를 선택하면 해당 일진까지 연결해 볼 수 있습니다.')+'</div><div class="hj-part"><b>⑬ 화담식 최종 상담 포인트</b>이 명식은 “무엇이 있느냐”보다 <span class="hj-sub">월령에서 어떤 기운이 주도권을 잡고, 그 기운이 대운에서 어떻게 바뀌느냐</span>가 핵심입니다. 따라서 실제 상담 순서는 <b style="display:inline">① 신강·신약 판단 → ② 격국 → ③ 조후·용신 → ④ 대운 → ⑤ 세운·월운</b>으로 이어가는 것이 좋습니다. 다음 단계에서는 이 다섯 항목을 자동 판정하도록 확장할 수 있습니다.</div><div class="note">※ 전통 명리학의 해석 체계를 바탕으로 한 참고용 상담입니다. 건강·법률·투자·재무 등 중요한 결정은 해당 분야의 전문 판단과 함께 보세요.</div>';out.style.display='block';out.scrollIntoView({behavior:'smooth',block:'start'})})}addFortune();new MutationObserver(()=>{d.querySelectorAll('.db').forEach(c=>{c.style.cursor='pointer';c.style.touchAction='manipulation'});addFortune()}).observe(d.body,{childList:true,subtree:true})})</script></body></html>
