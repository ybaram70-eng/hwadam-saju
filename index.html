<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#20352d"><title>화담철학관 만세력</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1e8}iframe{display:block;width:100%;height:100%;border:0;background:#f5f1e8}</style></head><body><iframe id="app" src="/app.html?v=20260818-5" title="화담철학관 만세력"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;const st=d.createElement('style');st.textContent='.db .dd{display:none!important}.db.active .dd{display:none!important}.hj-sec{margin-top:20px;padding:17px;border:2px solid #20352d;border-radius:18px;background:#fffdf8}.hj-sec h3{margin:0 0 10px}.hj-out{display:none;margin-top:12px}.hj-part{padding:14px;margin:9px 0;border-radius:13px;background:#f3efe7;font-size:13px;line-height:1.9}.hj-part b{display:block;color:#20352d;font-size:15px;margin-bottom:5px}.hj-head{padding:14px;border-radius:14px;background:#20352d;color:#fff;line-height:1.8;margin-bottom:10px}.hj-sub{color:#7a684c;font-weight:700}.hj-badge{display:inline-block;padding:4px 8px;margin:2px 4px 2px 0;border-radius:10px;background:#e7eee9;color:#20352d;font-size:11px;font-weight:700}';d.head.appendChild(st);function txt(id){return(d.getElementById(id)?.textContent||'').trim()}function activeText(sel){return(d.querySelector(sel)?.textContent||'').replace(/\s+/g,' ').trim()}function parsePillars(){return[txt('yP'),txt('mP'),txt('dP'),txt('hP')].map(x=>x.replace(/\s/g,''))}const stemEl={갑:'목',을:'목',병:'화',정:'화',무:'토',기:'토',경:'금',신:'금',임:'수',계:'수'},branchEl={자:'수',축:'토',인:'목',묘:'목',진:'토',사:'화',오:'화',미:'토',신:'금',유:'금',술:'토',해:'수'},produces={목:'화',화:'토',토:'금',금:'수',수:'목'},controls={목:'토',토:'수',수:'화',화:'금',금:'목'},generatedBy={목:'수',화:'목',토:'화',금:'토',수:'금'},controlledBy={목:'금',화:'수',토:'목',금:'화',수:'토'};function seasonEl(b){if(['인','묘'].includes(b))return'목';if(['사','오'].includes(b))return'화';if(['신','유'].includes(b))return'금';if(['해','자'].includes(b))return'수';return'토'}function strengthJudge(ps){const dmEl=stemEl[ps[2][0]],monthB=ps[1][1],mEl=seasonEl(monthB);let score=0,detail=[];if(mEl===dmEl){score+=3;detail.push('월령이 일간과 같은 오행이라 득령')}else if(generatedBy[dmEl]===mEl){score+=2;detail.push('월령이 일간을 생하여 도움')}else if(produces[dmEl]===mEl){score-=1;detail.push('월령으로 기운이 설기')}else if(controls[mEl]===dmEl){score-=2;detail.push('월령이 일간을 극함')}else if(controls[dmEl]===mEl){score-=1;detail.push('월령을 극하느라 기운 소모')}for(let i=0;i<4;i++){if(i!==2){const se=stemEl[ps[i][0]];if(se===dmEl)score+=1;else if(se===generatedBy[dmEl])score+=1;else if(se===produces[dmEl])score-=.5;else if(se===controlledBy[dmEl])score-=.7}}const roots=ps.filter(p=>branchEl[p[1]]===dmEl).length;score+=roots*1.2;if(roots)detail.push('지지에 같은 오행의 뿌리 '+roots+'개');let label=score>=4?'신강':score<=1?'신약':'중화에 가까움';return{label,score:Math.round(score*10)/10,detail:detail.join(' · '),dmEl,mEl}}function tenGod(dmStem,targetStem){const dm=stemEl[dmStem],te=stemEl[targetStem],yin={갑:0,을:1,병:0,정:1,무:0,기:1,경:0,신:1,임:0,계:1},same=yin[dmStem]===yin[targetStem];if(te===dm)return same?'비견':'겁재';if(produces[dm]===te)return same?'식신':'상관';if(controls[dm]===te)return same?'편재':'정재';if(controlledBy[dm]===te)return same?'편관':'정관';if(generatedBy[dm]===te)return same?'편인':'정인';return''}function structureJudge(ps){const dm=ps[2][0],monthStem=ps[1][0],g=tenGod(dm,monthStem);const map={비견:'건록격 경향',겁재:'월겁격 경향',식신:'식신격 경향',상관:'상관격 경향',편재:'편재격 경향',정재:'정재격 경향',편관:'칠살격 경향',정관:'정관격 경향',편인:'편인격 경향',정인:'정인격 경향'};return{god:g,label:map[g]||'격국 추가 검토',note:'월간과 월령을 중심으로 1차 분류한 결과입니다. 지장간 투출·합화·특수격은 별도 검토가 필요합니다.'}}function usefulJudge(ps,sj){const monthB=ps[1][1],season=seasonEl(monthB),dm=sj.dmEl;let climate=[];if(['해','자','축'].includes(monthB))climate.push('한랭하므로 화의 온기');if(['사','오','미'].includes(monthB))climate.push('조열하므로 수의 윤택');if(['인','묘','진'].includes(monthB))climate.push('목기가 왕하므로 금의 정리와 화의 발산');if(['신','유','술'].includes(monthB))climate.push('금기가 강하므로 화의 온기와 수의 유통');let useful=[];if(sj.label==='신강'){useful.push(produces[dm],controls[dm]);}else if(sj.label==='신약'){useful.push(dm,generatedBy[dm]);}else{useful.push(produces[dm],generatedBy[dm]);}return{climate:climate.join(' · '),useful:[...new Set(useful)].join('·'),note:'용신은 단일 오행 확정이 아니라 조후·억부·통관을 함께 본 1차 자동 판정입니다.'}}function flowText(label,text){if(!text)return'선택된 '+label+'이 없습니다.';return'현재 선택한 '+label+'은 <span class="hj-sub">'+text+'</span>입니다. 원국의 신강·신약과 용신 방향에 비추어 보완 기운이 들어오는지, 과다 기운을 더 키우는지 확인해 실제 체감 강도를 판단합니다.'}function showDay(card){d.querySelectorAll('.db').forEach(x=>x.classList.remove('active'));card.classList.add('active');let box=d.getElementById('selectedDayDetail');if(!box){box=d.createElement('div');box.id='selectedDayDetail';box.className='summary';box.style.cssText='margin:12px 0 14px;padding:14px;border:3px solid #20352d;border-radius:13px;background:#edf3ef;font-size:14px;line-height:1.8;color:#232323';const s=d.getElementById('daySummary');if(s)s.insertAdjacentElement('afterend',box)}const detail=card.querySelector('.dd');box.innerHTML='<b style="font-size:16px">선택한 날짜 상세</b><br>'+(detail?detail.innerHTML:card.innerHTML);box.style.display='block'}function pick(e){const c=e.target?.closest?.('.db');if(c){e.preventDefault();e.stopPropagation();showDay(c)}}d.addEventListener('click',pick,true);d.addEventListener('touchend',pick,true);function addFortune(){if(d.getElementById('hwadamFortune'))return;const result=d.getElementById('result');if(!result)return;const sec=d.createElement('div');sec.id='hwadamFortune';sec.className='hj-sec';sec.innerHTML='<h3>화담 고급 사주판정</h3><div class="summary">신강·신약 → 격국 → 조후·용신 → 대운 → 세운·월운 순서로 자동 판정합니다.</div><button type="button" id="fortuneBtn">고급 사주판정 보기</button><div id="fortuneOut" class="hj-out"></div>';result.appendChild(sec);d.getElementById('fortuneBtn').onclick=()=>{const ps=parsePillars();if(ps.some(x=>x.length<2)){alert('먼저 사주팔자 계산을 해주세요.');return}const sj=strengthJudge(ps),gj=structureJudge(ps),uj=usefulJudge(ps,sj),luck=activeText('.lb.active'),annual=activeText('.ab.active'),month=activeText('.mb.active'),day=activeText('.db.active'),who=txt('who');const out=d.getElementById('fortuneOut');out.innerHTML='<div class="hj-head"><b style="font-size:17px">'+who+' 고급 명리 판정</b><br>'+ps.join(' · ')+'</div><div class="hj-part"><b>① 신강·신약 자동판정</b><span class="hj-badge">'+sj.label+'</span><span class="hj-badge">점수 '+sj.score+'</span><br>일간 오행은 <span class="hj-sub">'+sj.dmEl+'</span>, 월령 계절 기운은 <span class="hj-sub">'+sj.mEl+'</span>입니다.<br>'+sj.detail+'<br><br>판정 원칙: 월령의 득령 여부, 천간의 비겁·인성 지원, 지지의 뿌리를 합산해 1차 신강·신약을 판정했습니다.</div><div class="hj-part"><b>② 격국 자동판정</b><span class="hj-badge">'+gj.label+'</span><br>월간 기준 십신은 <span class="hj-sub">'+gj.god+'</span>입니다. '+gj.note+' 따라서 현재 결과는 “확정 격국”이 아니라 상담용 1차 판정으로 보시면 됩니다.</div><div class="hj-part"><b>③ 조후·용신 자동판정</b><span class="hj-badge">우선 검토 '+uj.useful+'</span><br>조후: '+uj.climate+'가 필요합니다.<br>억부 기준으로는 '+(sj.label==='신강'?'일간의 강한 힘을 설기하거나 제어하는 방향':sj.label==='신약'?'일간을 돕고 생조하는 방향':'한쪽으로 치우치지 않도록 순환시키는 방향')+'을 우선합니다.<br>'+uj.note+'</div><div class="hj-part"><b>④ 대운 판정</b>'+flowText('대운',luck)+'<br><br>좋은 대운은 단순히 길신이 오는 시기가 아니라, 원국의 과다한 기운을 조절하고 필요한 기운을 보완하는 시기입니다. 반대로 기신 성향의 오행이 반복되면 같은 문제의 부담이 커질 수 있습니다.</div><div class="hj-part"><b>⑤ 세운·월운 판정</b>'+flowText('세운',annual)+'<br><br>'+flowText('월운',month)+(day?'<br><br>선택 일진: <span class="hj-sub">'+day+'</span>':'')+'<br><br>세운은 사건의 성격, 월운은 실제 행동 시기, 일진은 미세한 컨디션을 보는 순서로 사용합니다.</div><div class="hj-part"><b>화담식 최종 결론</b>이 명식의 자동 판정 순서는 <b style="display:inline">신강·신약 '+sj.label+' → '+gj.label+' → 용신 후보 '+uj.useful+' → 대운 → 세운·월운</b>입니다. 실제 상담에서는 지장간 투출, 합화 성립, 형충의 작동, 대운의 시작 시점까지 함께 검증하면 정확도가 더 높아집니다.</div><div class="note">※ 전통 명리학 규칙을 바탕으로 한 자동 1차 판정입니다. 격국·용신은 학파별 차이가 있어 최종 확정값이 아니라 상담 보조용으로 사용하세요.</div>';out.style.display='block';out.scrollIntoView({behavior:'smooth',block:'start'})}}addFortune();new MutationObserver(addFortune).observe(d.body,{childList:true,subtree:true})})</script></body></html>
