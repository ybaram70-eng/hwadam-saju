<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#20352d"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>화담철학관 만세력</title><style>html,body{margin:0;width:100%;height:100%;background:#f3efe6}iframe{display:block;width:100%;height:100%;border:0;background:#f3efe6;padding-bottom:72px;box-sizing:border-box}.bottomNav{position:fixed;z-index:9999;left:0;right:0;bottom:0;height:68px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -2px 10px rgba(0,0,0,.06)}.navItem{border:0;background:#fff;color:#555;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 1px;cursor:pointer}.navItem .ico{font-size:22px;line-height:1}.navItem .txt{font-size:11px;font-weight:700;white-space:nowrap}.navItem.active{color:#c84d1b}.navItem.active .ico{transform:translateY(-1px)}@media(min-width:800px){.bottomNav{left:50%;transform:translateX(-50%);max-width:760px}}</style></head><body><iframe id="app" src="/stable.html?v=20260818-journal1" title="화담철학관 만세력"></iframe><nav class="bottomNav" aria-label="주요 메뉴"><button class="navItem active" data-target="home"><span class="ico">⌂</span><span class="txt">홈</span></button><button class="navItem" data-target="input"><span class="ico">✎</span><span class="txt">사주입력</span></button><button class="navItem" data-target="analysis"><span class="ico">♧</span><span class="txt">화담분석</span></button><button class="navItem" data-target="calendar"><span class="ico">▣</span><span class="txt">택일달력</span></button><button class="navItem" data-target="journal"><span class="ico">✣</span><span class="txt">화담일지</span></button></nav><script>const f=document.getElementById('app');let d=null;function topOf(el){if(!el)return 0;return el.getBoundingClientRect().top+(d.defaultView.scrollY||0)-8}function setActive(btn){document.querySelectorAll('.navItem').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}document.querySelectorAll('.navItem').forEach(btn=>btn.addEventListener('click',()=>{if(!d)return;const t=btn.dataset.target;let el=null;if(t==='home')el=d.body;if(t==='input')el=d.querySelector('.card')||d.getElementById('name');if(t==='analysis')el=d.getElementById('result')||d.querySelector('.pillars');if(t==='calendar'){el=d.querySelector('.years');if(!el){alert('택일달력은 다음 단계에서 별도 화면으로 확장합니다.');return}}if(t==='journal')el=d.getElementById('journalPanel')||d.querySelector('.customerBox');if(el){d.defaultView.scrollTo({top:topOf(el),behavior:'smooth'});setActive(btn)}}));f.addEventListener('load',()=>{try{d=f.contentDocument;if(!d)return;const css=d.createElement('style');css.textContent=`body{background:#f3efe6!important}.w{max-width:760px!important;padding:8px 5px 55px!important}.hero{border-radius:8px!important;padding:13px 12px!important;margin-bottom:7px!important;background:#20352d!important}.hero h1{font-size:23px!important}.hero p{font-size:11px!important}.card{border-radius:5px!important;padding:8px!important;margin-bottom:7px!important;border-color:#c9c0b2!important;background:#fffdf9!important}h2{font-size:18px!important;margin-bottom:8px!important}.status{border-radius:4px!important;padding:7px 8px!important;margin-bottom:7px!important}.pillars{margin-top:6px!important;border:1px solid #777!important}.p{border-right:1px solid #999!important}.p small{background:#efeee9!important;padding:5px 1px!important;font-size:12px!important}.p b{font-size:29px!important;padding:7px 1px 1px!important;line-height:1!important}.p em{font-size:15px!important;padding:1px 1px 7px!important}.detail{margin-top:6px!important}.r{grid-template-columns:68px 1fr!important}.r b,.r span{padding:6px!important;font-size:11px!important}.luck,.years{gap:3px!important}.lb,.yb{min-width:74px!important}.customerBox{margin-top:10px;padding:10px;border:1px solid #d7cdbb;background:#f8f4ec;border-radius:8px}.customerBox h3{margin:0 0 8px;font-size:17px}.customerBox select{margin-bottom:7px}.customerActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.customerActions button{margin:0;padding:11px 4px;font-size:13px}.saveBtn{background:#20352d!important}.loadBtn{background:#716d64!important}.deleteBtn{background:#9a443a!important}.saveMsg{font-size:12px;margin-top:7px;color:#365247}@media(max-width:430px){.w{padding:4px 2px 50px!important}.card{padding:6px!important}.p b{font-size:25px!important}.customerActions{grid-template-columns:1fr}.customerActions button{font-size:14px}}`;d.head.appendChild(css);const hero=d.querySelector('.hero p');if(hero)hero.textContent='사주원국·십신·지장간·12운성·신살·대운·세운을 한 화면에서 확인합니다.';const detail=d.createElement('script');detail.src='/detail-v2.js?v=20260818-1';d.body.appendChild(detail);const ids=['name','gender','year','month','day','hour','minute','boundary','leap'];const formKey='hwadam_birth_form_v1',customersKey='hwadam_customers_v1';function read(k,def){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(def))}catch(e){return def}}function formData(){const x={};ids.forEach(id=>{const el=d.getElementById(id);if(el)x[id]=el.value});const c=d.querySelector('input[name=cal]:checked');if(c)x.cal=c.value;return x}function fill(x){ids.forEach(id=>{const el=d.getElementById(id);if(el&&x[id]!==undefined)el.value=x[id]});if(x.cal){d.querySelectorAll('input[name=cal]').forEach(r=>r.checked=r.value===x.cal);const box=d.getElementById('leapBox');if(box)box.classList.toggle('hide',x.cal!=='lunar')}}fill(read(formKey,{}));ids.forEach(id=>{const el=d.getElementById(id);if(el)el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>localStorage.setItem(formKey,JSON.stringify(formData()))) });d.querySelectorAll('input[name=cal]').forEach(r=>r.addEventListener('change',()=>localStorage.setItem(formKey,JSON.stringify(formData()))));const go=d.getElementById('go');const box=d.createElement('div');box.className='customerBox';box.innerHTML='<h3>고객 저장</h3><select id="savedCustomers"><option value="">저장된 고객 선택</option></select><div class="customerActions"><button type="button" class="saveBtn" id="saveCustomer">현재 고객 저장</button><button type="button" class="loadBtn" id="loadCustomer">불러오기</button><button type="button" class="deleteBtn" id="deleteCustomer">삭제</button></div><div class="saveMsg" id="saveMsg">이름과 생년월일을 입력한 뒤 저장하세요.</div>';if(go)go.insertAdjacentElement('afterend',box);function render(selectName){const sel=d.getElementById('savedCustomers'),arr=read(customersKey,[]);sel.innerHTML='<option value="">저장된 고객 선택</option>';arr.forEach((c,i)=>{const o=d.createElement('option');o.value=String(i);o.textContent=(c.name||'이름없음')+' · '+(c.year||'')+'.'+(c.month||'')+'.'+(c.day||'');sel.appendChild(o)});if(selectName){const i=arr.findIndex(c=>c.name===selectName);if(i>=0)sel.value=String(i)}}render();d.getElementById('saveCustomer').onclick=()=>{const x=formData();if(!x.name||!x.year||!x.month||!x.day){d.getElementById('saveMsg').textContent='이름과 생년월일을 먼저 입력해 주세요.';return}let arr=read(customersKey,[]);const i=arr.findIndex(c=>c.name===x.name&&c.year===x.year&&c.month===x.month&&c.day===x.day);if(i>=0)arr[i]=x;else arr.push(x);localStorage.setItem(customersKey,JSON.stringify(arr));localStorage.setItem(formKey,JSON.stringify(x));render(x.name);d.getElementById('saveMsg').textContent=x.name+' 고객 정보를 저장했습니다.';setTimeout(()=>d.defaultView.__hwadamJournal?.refreshCustomers?.(),50)};d.getElementById('loadCustomer').onclick=()=>{const sel=d.getElementById('savedCustomers');if(sel.value==='')return d.getElementById('saveMsg').textContent='저장된 고객을 먼저 선택해 주세요.';const x=read(customersKey,[])[+sel.value];if(x){fill(x);localStorage.setItem(formKey,JSON.stringify(x));d.getElementById('saveMsg').textContent=(x.name||'고객')+' 정보를 불러왔습니다.';setTimeout(()=>d.defaultView.__hwadamJournal?.refreshCustomers?.(),50)}};d.getElementById('deleteCustomer').onclick=()=>{const sel=d.getElementById('savedCustomers');if(sel.value==='')return d.getElementById('saveMsg').textContent='삭제할 고객을 먼저 선택해 주세요.';let arr=read(customersKey,[]);const n=arr[+sel.value]?.name||'고객';arr.splice(+sel.value,1);localStorage.setItem(customersKey,JSON.stringify(arr));render();d.getElementById('saveMsg').textContent=n+' 정보를 삭제했습니다.';setTimeout(()=>d.defaultView.__hwadamJournal?.refreshCustomers?.(),50)};if(go)go.addEventListener('click',()=>localStorage.setItem(formKey,JSON.stringify(formData())),true);const journal=d.createElement('script');journal.src='/journal-v1.js?v=20260818-1';d.body.appendChild(journal)}catch(e){console.error(e)}})</script></body></html>
