<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#20352d"><title>화담철학관 만세력</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1e8}iframe{display:block;width:100%;height:100%;border:0;background:#f5f1e8}</style></head><body><iframe id="app" src="/app.html?v=20260818-3" title="화담철학관 만세력"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;const st=d.createElement('style');st.textContent='.db .dd{display:none!important}.db.active .dd{display:none!important}.hj-sec{margin-top:20px;padding:17px;border:2px solid #20352d;border-radius:18px;background:#fffdf8}.hj-sec h3{margin:0 0 10px}.hj-out{display:none;margin-top:12px}.hj-part{padding:12px;margin:8px 0;border-radius:13px;background:#f3efe7;font-size:13px;line-height:1.75}.hj-part b{display:block;color:#20352d;font-size:14px;margin-bottom:4px}';d.head.appendChild(st);function show(card){if(!card)return;d.querySelectorAll('.db').forEach(x=>x.classList.remove('active'));card.classList.add('active');let box=d.getElementById('selectedDayDetail');if(!box){box=d.createElement('div');box.id='selectedDayDetail';box.className='summary';box.style.cssText='margin:12px 0 14px;padding:14px;border:3px solid #20352d;border-radius:13px;background:#edf3ef;font-size:14px;line-height:1.8;color:#232323';const s=d.getElementById('daySummary');if(s)s.insertAdjacentElement('afterend',box)}const detail=card.querySelector('.dd');box.innerHTML='<b style="font-size:16px">선택한 날짜 상세</b><br>'+(detail?detail.innerHTML:card.innerHTML);box.style.display='block';setTimeout(()=>box.scrollIntoView({behavior:'smooth',block:'center'}),30)}function pick(e){const c=e.target&&e.target.closest?e.target.closest('.db'):null;if(c){e.preventDefault();e.stopPropagation();show(c)}}d.addEventListener('click',pick,true);d.addEventListener('touchend',pick,true);d.addEventListener('pointerup',pick,true);function addFortune(){if(d.getElementById('hwadamFortune'))return;const result=d.getElementById('result');if(!result)return;const sec=d.createElement('div');sec.id='hwadamFortune';sec.className='hj-sec';sec.innerHTML='<h3>화담 사주풀이</h3><div class="summary">사주팔자 계산 후 아래 버튼을 누르면 원국의 일간·오행·십신·합충형파해와 현재 표시된 운의 흐름을 바탕으로 풀이합니다.</div><button type="button" id="fortuneBtn">사주풀이 보기</button><div id="fortuneOut" class="hj-out"></div>';result.appendChild(sec);d.getElementById('fortuneBtn').addEventListener('click',()=>{const dm=(d.getElementById('dm')?.textContent||'').trim(),el=(d.getElementById('el')?.textContent||'').trim(),tg=(d.getElementById('tg')?.textContent||'').trim(),rel=(d.getElementById('relations')?.textContent||'').trim(),who=(d.getElementById('who')?.textContent||'').trim();if(!dm){alert('먼저 사주팔자 계산을 해주세요.');return}const stem=dm.charAt(0);const nature={갑:'큰 나무처럼 성장·개척·원칙을 중시하는 기질',을:'풀과 덩굴처럼 유연하고 관계 조율에 능한 기질',병:'태양처럼 밝고 표현력·추진력이 강한 기질',정:'등불처럼 섬세하고 집중력·감각이 돋보이는 기질',무:'큰 산처럼 중심을 잡고 책임과 신뢰를 중시하는 기질',기:'논밭처럼 실용적이고 돌봄·관리 능력이 좋은 기질',경:'큰 쇠처럼 결단력과 실행력이 강한 기질',신:'보석처럼 정교하고 기준·완성도를 중시하는 기질',임:'큰 물처럼 활동 범위가 넓고 변화 대응력이 좋은 기질',계:'비와 이슬처럼 관찰력·직관·적응력이 섬세한 기질'}[stem]||'일간의 성질을 중심으로 자신만의 방식이 뚜렷한 기질';const wealth=tg.includes('편재')||tg.includes('정재')?'재성의 작용이 확인되므로 돈의 흐름, 거래, 성과 관리가 중요한 축입니다. 재물은 들어오는 힘뿐 아니라 보유·관리 구조를 함께 보는 것이 좋습니다.':'재물운은 재성 하나만으로 단정하지 않고 원국 전체와 대운·세운의 흐름을 함께 판단해야 합니다.';const work=tg.includes('정관')||tg.includes('편관')?'관성의 작용은 책임, 조직, 직위, 규칙과 연결해 해석할 수 있습니다. 직업에서는 책임 범위와 권한의 균형이 중요합니다.':tg.includes('식신')||tg.includes('상관')?'식상 작용은 표현, 영업, 생산, 전문성 발휘와 연결됩니다. 자신의 능력을 밖으로 드러내 성과로 바꾸는 구조를 살펴볼 만합니다.':'직업·사업운은 십신의 배치와 대운에서 들어오는 기운을 함께 보아야 정확도가 높아집니다.';const out=d.getElementById('fortuneOut');out.innerHTML='<div class="hj-part"><b>① 원국 총평</b>'+who+'의 명식에서 일간은 '+dm+'입니다. 현재 계산된 오행 분포는 '+el+'입니다. 한 가지 요소만으로 길흉을 단정하기보다 월령과 오행의 균형, 십신 배치를 함께 보는 것이 핵심입니다.</div><div class="hj-part"><b>② 성향·기질</b>'+nature+'로 해석합니다. 강점이 지나치면 같은 성질이 고집이나 과부하로 나타날 수 있으므로 균형이 중요합니다.</div><div class="hj-part"><b>③ 오행과 십신</b>오행: '+el+'<br>십신: '+tg+'</div><div class="hj-part"><b>④ 재물운</b>'+wealth+'</div><div class="hj-part"><b>⑤ 직업·사업운</b>'+work+'</div><div class="hj-part"><b>⑥ 합·충·형·파·해</b>'+(rel||'현재 표시된 원국 관계를 기준으로 추가 해석합니다.')+'</div><div class="hj-part"><b>⑦ 대운·세운·월운</b>위의 대운·세운·월운에서 원하는 시기를 선택해 흐름을 함께 확인하세요. 원국에 들어오는 기운이 보완인지 과다인지에 따라 실제 체감이 달라집니다.</div><div class="note">※ 전통 명리학의 해석 체계를 바탕으로 한 참고용 풀이입니다. 중요한 재정·건강·법률 결정은 이 풀이만으로 판단하지 마세요.</div>';out.style.display='block';out.scrollIntoView({behavior:'smooth',block:'start'})})}addFortune();new MutationObserver(()=>{d.querySelectorAll('.db').forEach(c=>{c.style.cursor='pointer';c.style.touchAction='manipulation'});addFortune()}).observe(d.body,{childList:true,subtree:true})})</script></body></html>
