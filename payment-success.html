<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>화담 결제 완료</title><style>body{margin:0;background:#f3efe6;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#20352d}.w{max-width:620px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd2c1;border-radius:20px;padding:22px}.muted{color:#6f6b64;line-height:1.7}.ok{font-size:22px;font-weight:800}.mode{margin:12px 0;padding:11px 12px;border-radius:12px;font-weight:800}.mode.test{background:#fff3cf;color:#99621a}.mode.live{background:#e9f4ee;color:#1f5d42}button{width:100%;padding:14px;border:0;border-radius:13px;background:#20352d;color:#fff;font-size:16px;font-weight:800}</style></head><body><div class="w"><div class="card"><div id="state" class="ok">결제를 확인하고 있습니다…</div><div id="mode" class="mode" hidden></div><p id="detail" class="muted">잠시만 기다려 주세요.</p><div id="guide" class="muted" hidden style="background:#f0f6f1;border-radius:12px;padding:12px;margin:12px 0"><strong>결제한 상담 결과 안내</strong><p style="margin:8px 0">2027년 전체 운세와 재물·사업·관계·건강, 1월부터 12월까지의 월별 운세를 확인할 수 있습니다.</p><p style="margin:8px 0">아래 버튼을 눌러 리포트로 이동하세요. 나중에는 ‘상담 기록·리포트’ 메뉴에서 결제 기록을 확인할 수 있습니다.</p><p style="margin:8px 0">이미 결제했다면 다시 결제하지 마세요. 리포트가 열리지 않으면 고객센터에 결제 내역 확인을 요청해 주세요.</p></div><button id="back" hidden>결제한 리포트 열기</button></div></div><script>const q=new URLSearchParams(location.search),paymentKey=q.get('paymentKey'),orderId=q.get('orderId'),amount=q.get('amount'),queryReportId=q.get('reportId')||'',queryProductId=q.get('productId')||'',queryProductName=q.get('productName')||'',state=document.getElementById('state'),detail=document.getElementById('detail'),mode=document.getElementById('mode'),back=document.getElementById('back');(async()=>{try{let pending={};try{pending=JSON.parse(localStorage.getItem('hwadam_pending_payment')||'{}')||{}}catch{}if(!paymentKey||!orderId||!amount)throw Error('결제 승인 정보가 없습니다.');const reportId=pending.reportId||queryReportId,productId=pending.productId||queryProductId||'comprehensive',productName=pending.productName||queryProductName||'';if(!reportId)throw Error('결제할 리포트 정보가 없습니다.');if(pending.orderId&&pending.orderId!==orderId)throw Error('주문번호가 일치하지 않습니다.');if(pending.amount&&Number(pending.amount)!==Number(amount))throw Error('결제 금액이 일치하지 않습니다.');const r=await fetch('/api/payment-confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentKey,orderId,amount:Number(amount),reportId,productId})}),data=await r.json();if(!r.ok){console.error('hwadam-payment-confirm-failed',{status:r.status,code:data.code||'',orderId});throw Error((data.error||'결제 승인에 실패했습니다.')+(data.code?' (오류코드: '+data.code+')':''));}let map={};try{map=JSON.parse(localStorage.getItem('hwadam_report_entitlements')||'{}')||{}}catch{}map[reportId]={token:data.entitlementToken,orderId,amount:Number(amount),productId:data.productId||productId||'',approvedAt:data.approvedAt||new Date().toISOString()};localStorage.setItem('hwadam_report_entitlements',JSON.stringify(map));localStorage.setItem('hwadam_paid_report',JSON.stringify({reportId:reportId,orderId,paymentKey,amount:Number(amount),productId:data.productId||productId||'',productName:data.productName||productName||'',paymentMode:data.mode||pending.paymentMode||'',approvedAt:data.approvedAt||new Date().toISOString(),status:data.status||'DONE'}));localStorage.removeItem('hwadam_pending_payment');state.textContent='결제가 완료되었습니다!';document.getElementById('guide').hidden=false;mode.hidden=false;mode.className='mode '+(data.isTest?'test':'live');mode.textContent=data.isTest?'테스트 결제 완료 · 실제 금액은 청구되지 않았습니다.':'실결제 완료 · 실제 결제가 승인되었습니다.';detail.textContent=`${data.productName||productName||'상담 상품'} · ${Number(amount).toLocaleString('ko-KR')}원 결제가 확인되었습니다. 아래 버튼으로 결제한 리포트를 확인해 주세요.`;back.hidden=false;back.onclick=()=>{const pid=data.productId||productId||'';const base=pid.startsWith('face-')?'/face.html':pid.startsWith('palm-')?'/palm.html':'/manse';location.href=base+'?paidReport='+encodeURIComponent(reportId)}}catch(e){state.textContent='결제를 완료하지 못했습니다.';detail.textContent=e?.message||String(e);back.hidden=false;back.textContent='화담 만세력으로 돌아가기';back.onclick=()=>location.href='/'}})();</script></body></html>
