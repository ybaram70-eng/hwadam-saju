<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>화담 결제 완료</title><style>body{margin:0;background:#f3efe6;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#20352d}.w{max-width:620px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd2c1;border-radius:20px;padding:22px}.muted{color:#6f6b64;line-height:1.7}.ok{font-size:22px;font-weight:800}button{width:100%;padding:14px;border:0;border-radius:13px;background:#20352d;color:#fff;font-size:16px;font-weight:800}</style></head><body><div class="w"><div class="card"><div id="state" class="ok">결제를 확인하고 있습니다…</div><p id="detail" class="muted">잠시만 기다려 주세요.</p><button id="back" hidden>화담 만세력으로 돌아가기</button></div></div><script>const q=new URLSearchParams(location.search),paymentKey=q.get('paymentKey'),orderId=q.get('orderId'),amount=q.get('amount'),state=document.getElementById('state'),detail=document.getElementById('detail'),back=document.getElementById('back');(async()=>{try{let pending={};try{pending=JSON.parse(localStorage.getItem('hwadam_pending_payment')||'{}')}catch{}if(!paymentKey||!orderId||!amount)throw Error('결제 승인 정보가 없습니다.');if(pending.orderId&&pending.orderId!==orderId)throw Error('주문번호가 일치하지 않습니다.');if(pending.amount&&Number(pending.amount)!==Number(amount))throw Error('결제 금액이 일치하지 않습니다.');const r=await fetch('/api/payment-confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentKey,orderId,amount:Number(amount)})}),data=await r.json();if(!r.ok)throw Error(data.error||'결제 승인에 실패했습니다.');localStorage.setItem('hwadam_paid_report',JSON.stringify({orderId,paymentKey,amount:Number(amount),approvedAt:data.approvedAt||new Date().toISOString(),status:data.status||'DONE'}));localStorage.removeItem('hwadam_pending_payment');state.textContent='결제가 완료되었습니다.';detail.textContent='화담 AI 사주상담 리포트 결제가 정상 승인되었습니다.';back.hidden=false;back.onclick=()=>location.href='/'}catch(e){state.textContent='결제를 완료하지 못했습니다.';detail.textContent=e?.message||String(e);back.hidden=false;back.onclick=()=>location.href='/'}})();</script></body></html>
