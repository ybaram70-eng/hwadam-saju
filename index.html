<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#20352d">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>화담철학관 만세력</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f3efe6;overflow:hidden}
body{position:relative}
iframe{display:block;width:100%;height:100%;border:0;background:#f3efe6;padding-bottom:76px;box-sizing:border-box;transform:translateX(0);opacity:1;transition:transform .30s cubic-bezier(.22,.61,.36,1),opacity .22s ease;will-change:transform,opacity}
iframe.slide-out-left{transform:translateX(-18%);opacity:.18}
iframe.slide-out-right{transform:translateX(18%);opacity:.18}
iframe.slide-in-from-right{transition:none;transform:translateX(22%);opacity:.18}
iframe.slide-in-from-left{transition:none;transform:translateX(-22%);opacity:.18}
.bottomNav{position:fixed;z-index:9999;left:0;right:0;bottom:0;min-height:70px;padding:4px 4px calc(4px + env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border-top:1px solid #ddd8ce;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -3px 14px rgba(0,0,0,.07);backdrop-filter:blur(8px)}
.navItem{border:0;background:transparent;color:#5f5f5f;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 1px;cursor:pointer;touch-action:manipulation;border-radius:12px}
.navItem .ico{font-size:22px;line-height:1}
.navItem .txt{font-size:11px;font-weight:800;white-space:nowrap}
.navItem.active{color:#b94b1f;background:#fff6ef}
.navItem:active{transform:scale(.97)}
@media(min-width:800px){.bottomNav{left:50%;transform:translateX(-50%);max-width:760px;border-left:1px solid #eee7dc;border-right:1px solid #eee7dc;border-radius:16px 16px 0 0}}
@media(prefers-reduced-motion:reduce){iframe{transition:none}}
</style>
</head>
<body>
<iframe id="app" src="/stable.html?v=20260826-ui6" title="화담철학관 만세력"></iframe>
<nav class="bottomNav" aria-label="주요 메뉴">
<button class="navItem active" data-target="home"><span class="ico">⌂</span><span class="txt">홈</span></button>
<button class="navItem" data-target="input"><span class="ico">✎</span><span class="txt">사주입력</span></button>
<button class="navItem" data-target="analysis"><span class="ico">♧</span><span class="txt">화담분석</span></button>
<button class="navItem" data-target="calendar"><span class="ico">▣</span><span class="txt">택일달력</span></button>
<button class="navItem" data-target="journal"><span class="ico">✣</span><span class="txt">화담일지</span></button>
</nav>
<script>
const f=document.getElementById('app');
const navOrder=['home','input','analysis','calendar','journal'];
let d=null,mode='main',currentTarget='home',transitioning=false;
function setActive(btn){document.querySelectorAll('.navItem').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function topOf(el){return el?el.getBoundingClientRect().top+(d?.defaultView?.scrollY||0)-8:0}
function addScript(id,src){if(!d.getElementById(id)){const s=d.createElement('script');s.id=id;s.src=src;d.body.appendChild(s)}}
function setupMain(){try{d=f.contentDocument;if(!d)return;addScript('hwadam-ui-polish','/ui-polish.js?v=20260824-3');addScript('hwadam-premium-ui','/premium-ui.js?v=20260826-1');addScript('hwadam-progress-status','/progress-status.js?v=20260824-2');addScript('hwadam-twelve-stages','/twelve-stages.js?v=20260823-1');addScript('hwadam-detail-script','/detail-v2.js?v=20260821-1');addScript('hwadam-analysis-script','/analysis-v1.js?v=20260824-4');addScript('hwadam-analysis-strength-fix','/analysis-strength-fix.js?v=20260824-1');addScript('hwadam-analysis-luck-flow','/analysis-luck-flow.js?v=20260824-2');addScript('hwadam-analysis-final-polish','/analysis-final-polish.js?v=20260826-paid1');addScript('hwadam-journal-script','/journal-v1.js?v=20260822-5');addScript('hwadam-journal-lunar-addon','/journal-lunar-addon.js?v=20260822-1');addScript('hwadam-journal-customer-filter','/journal-customer-filter.js?v=20260822-3');addScript('hwadam-journal-recent-click','/journal-recent-click.js?v=20260822-2');addScript('hwadam-journal-save-fix','/journal-save-fix.js?v=20260822-1');addScript('hwadam-journal-current-sync','/journal-current-sync.js?v=20260826-2');addScript('hwadam-journal-core-result-sync','/journal-core-result-sync.js?v=20260826-2');addScript('hwadam-journal-luck-fix','/journal-luck-fix.js?v=20260826-1');addScript('hwadam-journal-analysis-sync','/journal-analysis-sync.js?v=20260824-1');addScript('hwadam-core-selftest','/core-selftest.js?v=20260824-1');addScript('hwadam-release-check','/release-check.js?v=20260824-1')}catch(e){console.error(e)}}
function setupCalendar(){try{const cd=f.contentDocument;if(!cd||!cd.body)return;if(!cd.getElementById('hwadam-calendar-hanja-fix')){const s=cd.createElement('script');s.id='hwadam-calendar-hanja-fix';s.src='/calendar-hanja-fix.js?v=20260824-1';cd.body.appendChild(s)}if(!cd.getElementById('hwadam-calendar-luck-order-fix')){const s=cd.createElement('script');s.id='hwadam-calendar-luck-order-fix';s.src='/calendar-luck-order-fix.js?v=20260826-1';cd.body.appendChild(s)}}catch(e){console.error(e)}}
function loadMain(cb){if(mode!=='main'){mode='main';d=null;f.src='/stable.html?v=20260826-ui6';const once=()=>{f.removeEventListener('load',once);setupMain();if(cb)setTimeout(cb,220)};f.addEventListener('load',once)}else{setupMain();if(cb)cb()}}
function visible(el){return !!(el&&el.getClientRects().length&&getComputedStyle(el).display!=='none')}
function inputCard(){return d?.querySelector('.card')||d?.getElementById('name')}
function showAnalysisHint(){if(!d)return;let n=d.getElementById('analysisHint');if(!n){n=d.createElement('div');n.id='analysisHint';n.textContent='먼저 출생정보를 확인한 뒤 “사주팔자 계산”을 눌러주세요. 계산 후 화담분석으로 바로 이동합니다.';n.style.cssText='margin:10px 0 0;padding:11px 12px;border-radius:12px;background:#fff8e9;border:1px solid #e2cf9e;color:#6f5518;font-size:12px;line-height:1.6;font-weight:700';const go=d.getElementById('go');if(go)go.insertAdjacentElement('afterend',n)}const go=d.getElementById('go');if(go){go.style.boxShadow='0 0 0 4px rgba(201,149,56,.22)';setTimeout(()=>{go.style.boxShadow=''},1800)}setTimeout(()=>{n?.remove()},5000)}
function findTarget(t){if(!d)return null;if(t==='home')return d.body;if(t==='input')return inputCard();if(t==='analysis'){const r=d.getElementById('result');if(visible(r))return d.getElementById('hwadamAnalysis')||r;showAnalysisHint();return inputCard()}if(t==='journal')return d.querySelector('.journalPanel');return null}
function goTargetInstant(t,n=0,done){setupMain();const el=findTarget(t);if(el){d.defaultView.scrollTo({top:topOf(el),left:0,behavior:'auto'});if(done)done();return}if(n<30)setTimeout(()=>goTargetInstant(t,n+1,done),120);else if(done)done()}
function ensureResultThenJournal(done){setupMain();const r=d?.getElementById('result');if(visible(r)){goTargetInstant('journal',0,done);return}const go=d?.getElementById('go'),name=d?.getElementById('name')?.value?.trim(),year=d?.getElementById('year')?.value;if(go&&name&&year){go.click();let n=0;const wait=()=>{if(visible(d?.getElementById('result'))){setTimeout(()=>goTargetInstant('journal',0,done),350);return}if(n++<30)setTimeout(wait,180);else goTargetInstant('journal',0,done)};wait()}else goTargetInstant('journal',0,done)}
function directionFor(next){const a=navOrder.indexOf(currentTarget),b=navOrder.indexOf(next);return b>=a?'forward':'back'}
function finishSlide(direction){f.classList.remove('slide-out-left','slide-out-right');f.classList.add(direction==='forward'?'slide-in-from-right':'slide-in-from-left');void f.offsetWidth;requestAnimationFrame(()=>{f.classList.remove('slide-in-from-right','slide-in-from-left');setTimeout(()=>{transitioning=false},320)})}
function slideNavigate(target,action){if(transitioning)return;if(target===currentTarget&&target!=='calendar'){action(()=>{});return}transitioning=true;const direction=directionFor(target);f.classList.remove('slide-in-from-right','slide-in-from-left');f.classList.add(direction==='forward'?'slide-out-left':'slide-out-right');setTimeout(()=>{action(()=>{currentTarget=target;finishSlide(direction)})},180)}
document.querySelectorAll('.navItem').forEach(btn=>btn.onclick=()=>{const t=btn.dataset.target;if(transitioning)return;setActive(btn);if(t==='calendar'){slideNavigate(t,done=>{mode='calendar';d=null;const once=()=>{f.removeEventListener('load',once);setupCalendar();done()};f.addEventListener('load',once);f.src='/calendar-v1.html?v=20260826-luck3'});return}slideNavigate(t,done=>loadMain(()=>{if(t==='journal')ensureResultThenJournal(done);else goTargetInstant(t,0,done)}))});
f.addEventListener('load',()=>{if(mode==='main')setupMain();else if(mode==='calendar')setupCalendar()});
</script>
</body>
</html>
