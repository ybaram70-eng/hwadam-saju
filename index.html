<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <meta name="theme-color" content="#20352d" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <title>화담철학관 만세력</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #f3efe6;
        overflow: hidden;
      }
      body {
        position: relative;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #f3efe6;
        padding-bottom: 76px;
        box-sizing: border-box;
        transform: none !important;
        opacity: 1 !important;
        transition: none !important;
        will-change: auto !important;
      }
      .bottomNav {
        position: fixed;
        z-index: 9999;
        left: 0;
        right: 0;
        bottom: 0;
        min-height: 70px;
        padding: 4px 2px calc(4px + env(safe-area-inset-bottom));
        background: rgba(255, 255, 255, 0.98);
        border-top: 1px solid #ddd8ce;
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        box-shadow: 0 -3px 14px rgba(0, 0, 0, 0.07);
      }
      .navItem {
        border: 0;
        background: transparent;
        color: #5f5f5f;
        font: inherit;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 5px 0;
        border-radius: 12px;
        min-width: 0;
      }
      .navItem .ico {
        font-size: 20px;
      }
      .navItem .txt {
        font-size: 9px;
        font-weight: 800;
        white-space: nowrap;
      }
      .navItem.active {
        color: #174b39;
        background: #f2ead9;
        box-shadow: inset 0 2px 0 #d4b26e;
      }
    </style>
  </head>
  <body>
    <iframe
      id="app"
      src="/stable.html?v=20260830-ui64"
      title="화담철학관 만세력"
    ></iframe>
    <nav class="bottomNav">
      <button class="navItem active" data-target="home">
        <span class="ico">⌂</span><span class="txt">홈</span></button
      ><button class="navItem" data-target="input">
        <span class="ico">✎</span><span class="txt">사주입력</span></button
      ><button class="navItem" data-target="analysis">
        <span class="ico">♧</span><span class="txt">화담분석</span></button
      ><button class="navItem" data-target="ai">
        <span class="ico">◉</span><span class="txt">AI상담</span></button
      ><button class="navItem" data-target="calendar">
        <span class="ico">▣</span><span class="txt">택일달력</span></button
      ><button class="navItem" data-target="journal">
        <span class="ico">✦</span><span class="txt">화담일지</span></button
      ><button class="navItem" data-target="customers">
        <span class="ico">♙♙</span><span class="txt">고객목록</span>
      </button>
    </nav>
    <script>
      const f = document.getElementById("app"),
        navOrder = [
          "home",
          "input",
          "analysis",
          "ai",
          "calendar",
          "journal",
          "customers",
        ];
      let d = null,
        mode = "main",
        currentTarget = "home",
        transitioning = false,
        pendingProduct = new URLSearchParams(location.search).get("product"),
        pendingOpen = new URLSearchParams(location.search).get("open");
      function setActiveTarget(t) {
        document
          .querySelectorAll(".navItem")
          .forEach((x) => x.classList.toggle("active", x.dataset.target === t));
        currentTarget = t;
      }
      function addScript(id, src) {
        if (!d.getElementById(id)) {
          const s = d.createElement("script");
          s.id = id;
          s.src = src;
          d.body.appendChild(s);
        }
      }
      function setupMain() {
        try {
          d = f.contentDocument;
          if (!d) return;
          addScript("hwadam-ui-polish", "/ui-polish.js?v=20260829-1");
          addScript("hwadam-premium-ui", "/premium-ui.js?v=20260829-4");
          addScript(
            "hwadam-home-dashboard",
            "/home-dashboard-mobile-v8.js",
          );
          addScript(
            "hwadam-signup-calendar",
            "/signup-calendar-ui.js?v=20260829-1",
          );
          addScript("hwadam-screen-mode", "/screen-mode.js?v=20260829-4");
          addScript(
            "hwadam-input-screen-fix",
            "/input-screen-fix.js?v=20260830-1",
          );
          addScript(
            "hwadam-member-autofill",
            "/member-autofill.js?v=20260829-4",
          );
          addScript(
            "hwadam-pillar-hanja-view",
            "/pillar-hanja-view.js?v=20260829-3",
          );
          addScript(
            "hwadam-relation-display-fix",
            "/relation-display-fix.js?v=20260829-1",
          );
          addScript(
            "hwadam-progress-status",
            "/progress-status.js?v=20260829-1",
          );
          addScript("hwadam-twelve-stages", "/twelve-stages.js?v=20260829-1");
          addScript("hwadam-detail-script", "/detail-v2.js?v=20260829-1");
          addScript("hwadam-luck-card-ui", "/luck-card-ui.js?v=20260829-1");
          addScript("hwadam-luck-detail-ui", "/luck-detail-ui.js?v=20260829-1");
          addScript("hwadam-year-card-fix", "/year-card-fix.js?v=20260829-1");
          addScript("hwadam-year-detail-ui", "/year-detail-ui.js?v=20260829-2");
          addScript("hwadam-month-luck-ui", "/month-luck-ui.js?v=20260829-1");
          addScript("hwadam-analysis-script", "/analysis-v1.js?v=20260829-1");
          addScript(
            "hwadam-analysis-strength-fix",
            "/analysis-strength-fix.js?v=20260829-1",
          );
          addScript(
            "hwadam-analysis-luck-flow",
            "/analysis-luck-flow.js?v=20260829-1",
          );
          addScript(
            "hwadam-analysis-after-years",
            "/analysis-after-years.js?v=20260829-1",
          );
          addScript(
            "hwadam-analysis-final-polish",
            "/analysis-final-polish.js?v=20260830-3",
          );
          addScript(
            "hwadam-analysis-collapse",
            "/analysis-collapse.js?v=20260829-4",
          );
          addScript(
            "hwadam-ai-answer-polish",
            "/ai-answer-polish.js?v=20260829-1",
          );
          addScript(
            "hwadam-ai-character-ui",
            "/ai-character-ui.js?v=20260829-1",
          );
          addScript(
            "hwadam-character-recommend",
            "/character-recommend.js?v=20260829-1",
          );
          addScript(
            "hwadam-ai-topic-expand",
            "/ai-topic-expand.js?v=20260829-1",
          );
          addScript(
            "hwadam-consultation-products",
            "/consultation-products.js?v=20260830-3",
          );
          addScript(
            "hwadam-compatibility-addon",
            "/compatibility-addon.js?v=20260829-1",
          );
          addScript("hwadam-journal-script", "/journal-v1.js?v=20260829-1");
          addScript(
            "hwadam-journal-lunar-addon",
            "/journal-lunar-addon.js?v=20260829-1",
          );
          addScript(
            "hwadam-journal-customer-filter",
            "/journal-customer-filter.js?v=20260829-1",
          );
          addScript(
            "hwadam-customer-open-analysis",
            "/customer-open-analysis.js?v=20260830-1",
          );
          addScript(
            "hwadam-journal-recent-click",
            "/journal-recent-click.js?v=20260829-1",
          );
          addScript(
            "hwadam-journal-save-fix",
            "/journal-save-fix.js?v=20260829-1",
          );
          addScript(
            "hwadam-journal-current-sync",
            "/journal-current-sync.js?v=20260829-2",
          );
          addScript(
            "hwadam-journal-core-result-sync",
            "/journal-core-result-sync.js?v=20260829-1",
          );
          addScript(
            "hwadam-journal-luck-fix",
            "/journal-luck-fix.js?v=20260829-1",
          );
          addScript(
            "hwadam-journal-analysis-sync",
            "/journal-analysis-sync.js?v=20260829-2",
          );
        } catch (e) {}
      }
      function setupCalendar() {
        try {
          const cd = f.contentDocument;
          if (!cd) return;
          [
            "calendar-hanja-fix.js?v=20260829-1",
            "calendar-luck-order-fix.js?v=20260829-1",
            "calendar-luck-display-fix.js?v=20260829-1",
          ].forEach((src, i) => {
            const id = "calfix" + i;
            if (!cd.getElementById(id)) {
              const s = cd.createElement("script");
              s.id = id;
              s.src = "/" + src;
              cd.body.appendChild(s);
            }
          });
        } catch {}
      }
      function loadMain(cb) {
        if (mode !== "main") {
          mode = "main";
          d = null;
          const once = () => {
            f.removeEventListener("load", once);
            setupMain();
            setTimeout(() => cb && cb(), 320);
          };
          f.addEventListener("load", once);
          f.src = "/stable.html?v=20260830-ui64";
        } else {
          setupMain();
          cb && cb();
        }
      }
      function hasResult() {
        return !!(
          (d?.getElementById("dP")?.textContent || "").trim() &&
          (d?.getElementById("yP")?.textContent || "").trim()
        );
      }
      function hasActiveCustomer() {
        try {
          return !!d?.defaultView?.sessionStorage?.getItem(
            "hwadam_active_customer",
          );
        } catch {
          return false;
        }
      }
      function showMode(t) {
        try {
          d?.defaultView?.hwadamScreenMode?.show(t);
        } catch {}
      }
      function fallbackInput(done) {
        setActiveTarget("input");
        showMode("input");
        done && done();
      }
      function ensureAnalysis(done) {
        setupMain();
        if (hasResult()) {
          showMode("analysis");
          done && done();
          return;
        }
        const m = d?.defaultView?.hwadamMemberAutofill;
        if (m?.canCalc?.()) {
          m.reset?.();
          m.calculate(true);
          let n = 0;
          const wait = () => {
            if (hasResult()) {
              showMode("analysis");
              done && done();
              return;
            }
            if (n++ < 30) {
              setTimeout(wait, 160);
              return;
            }
            fallbackInput(done);
          };
          wait();
          return;
        }
        fallbackInput(done);
      }
      function ensureAi(done) {
        setupMain();
        if (hasResult()) {
          let n = 0;
          const wait = () => {
            if (d?.getElementById("hwadamAiConsult")) {
              showMode("ai");
              done && done();
              return;
            }
            if (n++ < 30) {
              setTimeout(wait, 160);
              return;
            }
            showMode("analysis");
            done && done();
          };
          wait();
          return;
        }
        const m = d?.defaultView?.hwadamMemberAutofill;
        if (m?.canCalc?.()) {
          m.reset?.();
          m.calculate(true);
          let n = 0;
          const wait = () => {
            if (hasResult()) {
              ensureAi(done);
              return;
            }
            if (n++ < 30) {
              setTimeout(wait, 160);
              return;
            }
            fallbackInput(done);
          };
          wait();
          return;
        }
        fallbackInput(done);
      }
      function ensureJournal(done, customers = false) {
        if (customers) {
          showMode("customers");
          done && done();
          return;
        }
        if (!hasResult() && !hasActiveCustomer()) {
          fallbackInput(done);
          return;
        }
        showMode("journal");
        done && done();
      }
      function goSimple(t, done) {
        showMode(t);
        done && done();
      }
      function clickWhenMainReady(target) {
        let tries = 0;
        const run = () => {
          const inputReady = !!d?.getElementById("name");
          const helpersReady = !!(
            d?.defaultView?.hwadamMemberAutofill &&
            d?.defaultView?.hwadamScreenMode
          );
          if ((inputReady && helpersReady) || tries++ >= 35) {
            document
              .querySelector(`.navItem[data-target="${target}"]`)
              ?.click();
            return;
          }
          setTimeout(run, 200);
        };
        setTimeout(run, 200);
      }
      function slideNavigate(target, action) {
        if (transitioning) return;
        transitioning = true;
        action(() => {
          transitioning = false;
        });
      }
      document.querySelectorAll(".navItem").forEach(
        (btn) =>
          (btn.onclick = () => {
            const t = btn.dataset.target;
            if (transitioning) return;
            setActiveTarget(t);
            if (t === "input") {
              try {
                d?.defaultView?.sessionStorage?.removeItem(
                  "hwadam_active_customer",
                );
              } catch {}
            }
            if (t === "calendar") {
              slideNavigate(t, (done) => {
                mode = "calendar";
                d = null;
                const once = () => {
                  f.removeEventListener("load", once);
                  setupCalendar();
                  done();
                };
                f.addEventListener("load", once);
                f.src = "/calendar-v1.html?v=20260829-luck6";
              });
              return;
            }
            slideNavigate(t, (done) =>
              loadMain(() => {
                if (t === "analysis") ensureAnalysis(done);
                else if (t === "ai") ensureAi(done);
                else if (t === "journal") ensureJournal(done, false);
                else if (t === "customers") ensureJournal(done, true);
                else goSimple(t, done);
              }),
            );
          }),
      );
      f.addEventListener("load", () => {
        if (mode === "main") {
          setupMain();
          if (
            [
              "annual-fortune",
              "compatibility",
              "money-business",
              "comprehensive",
            ].includes(pendingProduct)
          ) {
            const year = new Date().getFullYear();
            const products = {
              "annual-fortune": {
                id: "annual-fortune",
                name: `${year}년 신년운세`,
                price: 9900,
              },
              compatibility: {
                id: "compatibility",
                name: "궁합 상담",
                price: 7900,
              },
              "money-business": {
                id: "money-business",
                name: "재물·사업 상담",
                price: 5900,
              },
              comprehensive: {
                id: "comprehensive",
                name: "종합 사주 상담",
                price: 9900,
              },
            };
            const product = {
              ...products[pendingProduct],
              at: new Date().toISOString(),
            };
            try {
              f.contentWindow.localStorage.setItem(
                "hwadam_selected_product",
                JSON.stringify(product),
              );
              history.replaceState({}, "", "/");
            } catch {}
            pendingProduct = "";
            clickWhenMainReady("ai");
          } else if (["analysis", "journal"].includes(pendingOpen)) {
            const target = pendingOpen;
            pendingOpen = "";
            try {
              history.replaceState({}, "", "/");
            } catch {}
            clickWhenMainReady(target);
          } else setTimeout(() => showMode(currentTarget), 500);
        } else setupCalendar();
      });
    </script>
  </body>
</html>
