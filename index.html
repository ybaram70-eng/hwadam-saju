<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#20352d"><title>화담철학관 만세력</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1e8}iframe{display:block;width:100%;height:100%;border:0;background:#f5f1e8}</style></head><body><iframe id="app" src="/app.html?v=20260818-1" title="화담철학관 만세력"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;function show(card){if(!card)return;d.querySelectorAll('.db').forEach(x=>x.classList.remove('active'));card.classList.add('active');let box=d.getElementById('selectedDayDetail');if(!box){box=d.createElement('div');box.id='selectedDayDetail';box.className='summary';box.style.cssText='margin:12px 0 14px;padding:14px;border:3px solid #20352d;border-radius:13px;background:#edf3ef;font-size:14px;line-height:1.8;color:#232323';const s=d.getElementById('daySummary');if(s)s.insertAdjacentElement('afterend',box)}const detail=card.querySelector('.dd');box.innerHTML='<b style="font-size:16px">선택한 날짜 상세</b><br>'+(detail?detail.innerHTML:card.innerHTML);box.style.display='block';setTimeout(()=>box.scrollIntoView({behavior:'smooth',block:'center'}),30)}function pick(e){const c=e.target&&e.target.closest?e.target.closest('.db'):null;if(c){e.preventDefault();e.stopPropagation();show(c)}}d.addEventListener('click',pick,true);d.addEventListener('touchend',pick,true);d.addEventListener('pointerup',pick,true);new MutationObserver(()=>{d.querySelectorAll('.db').forEach(c=>{c.style.cursor='pointer';c.style.touchAction='manipulation'})}).observe(d.body,{childList:true,subtree:true})})</script></body></html>
