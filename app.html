<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>화담철학관 만세력</title><style>html,body{margin:0;height:100%;background:#f5f1e8}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="/index.html?v=20260817b"></iframe><script>const ST=['갑','을','병','정','무','기','경','신','임','계'],BR=['인','묘','진','사','오','미','신','유','술','해','자','축'];let MX=null;function yStem(y){return ST[(y-4)%10]}function mP(y,m){let yy=m===1?y-1:y,ys=yStem(yy),sm={갑:2,기:2,을:4,경:4,병:6,신:6,정:8,임:8,무:0,계:0},o=m===1?11:m-2;return ST[(sm[ys]+o)%10]+BR[o]}function tg(dm,s){const el={갑:'목',을:'목',병:'화',정:'화',무:'토',기:'토',경:'금',신:'금',임:'수',계:'수'},yy={갑:1,병:1,무:1,경:1,임:1},prod={목:'화',화:'토',토:'금',금:'수',수:'목'},ctrl={목:'토',토:'수',수:'화',화:'금',금:'목'};let de=el[dm],se=el[s],same=yy[dm]===yy[s];if(de===se)return same?'비견':'겁재';if(prod[de]===se)return same?'식신':'상관';if(ctrl[de]===se)return same?'편재':'정재';if(ctrl[se]===de)return same?'편관':'정관';if(prod[se]===de)return same?'편인':'정인';return'-'}async function man(){if(!MX)MX=await import('https://esm.sh/manseryeok?bundle');return MX}function ensureDaySection(d){let sec=d.getElementById('daySection');if(sec)return sec;sec=d.createElement('div');sec.id='daySection';sec.innerHTML='<h3>선택한 월의 일진</h3><div id="daySummary" class="summary">월운을 누르면 날짜별 일진이 표시됩니다.</div><div id="daily" class="monthly"></div>';let monthSec=d.getElementById('monthSection');monthSec.parentNode.insertBefore(sec,monthSec.nextSibling);return sec}async function showDays(d,y,m,btn){let sec=ensureDaySection(d),sum=d.getElementById('daySummary'),box=d.getElementById('daily');sum.innerHTML='<b>'+y+'년 '+m+'월 일진</b> · 계산 중입니다…';box.innerHTML='';try{let M=await man(),dm=(d.getElementById('dP')?.textContent||'갑').trim()[0],days=new Date(y,m,0).getDate(),out=[];for(let day=1;day<=days;day++){let r=M.calculateFourPillars({year:y,month:m,day,hour:12,minute:0}),p=r.toObject().day,st='-',br='-';try{st=M.getTenGod(dm,p[0]);br=M.getBranchTenGod(dm,p[1])}catch{}out.push({day,p,st,br})}sum.innerHTML='<b>'+y+'년 '+m+'월 일진</b> · '+days+'일';for(const x of out){let el=d.createElement('div');el.style.cssText='border:1px solid #e4dccf;border-radius:13px;padding:10px;background:#fbf8f2';el.innerHTML='<b style="font-family:serif;font-size:18px">'+x.day+'일 · '+x.p+'</b><small style="display:block;color:#777;margin-top:3px;line-height:1.5">천간 '+x.st+' · 지지 '+x.br+'</small>';box.appendChild(el)}sec.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){sum.textContent='일진 표시 오류: '+(e?.message||String(e))}}function showMonths(d,y){let dm=(d.getElementById('dP')?.textContent||'갑').trim()[0],box=d.getElementById('monthly'),sum=d.getElementById('monthSummary'),sec=d.getElementById('monthSection');if(!box||!sum||!sec)return;sum.innerHTML='<b>'+y+'년 월운</b> · 원하는 월을 누르면 날짜별 일진이 표시됩니다.';box.innerHTML='';let daySec=d.getElementById('daySection');if(daySec)daySec.remove();for(let m=1;m<=12;m++){let p=mP(y,m),b=d.createElement('button');b.type='button';b.dataset.m=String(m);b.style.cssText='width:100%;margin:0;padding:10px;border:1px solid #e4dccf;border-radius:13px;background:#fbf8f2;color:#232323;text-align:left;cursor:pointer;touch-action:manipulation';b.innerHTML='<b style="font-family:serif;font-size:19px">'+m+'월 · '+p+'</b><small style="display:block;color:#777;margin-top:3px">천간 '+tg(dm,p[0])+' · 지지 '+tg(dm,p[1])+'</small>';b.addEventListener('click',()=>{[...box.children].forEach(x=>x.style.outline='');b.style.outline='3px solid #20352d';showDays(d,y,m,b)});box.appendChild(b)}sec.scrollIntoView({behavior:'smooth',block:'start'})}function hook(){let f=document.getElementById('app'),d=f.contentDocument;if(!d)return;let attach=()=>{d.querySelectorAll('.ab').forEach(e=>{if(e.dataset.monthHook)return;e.dataset.monthHook='1';e.style.cursor='pointer';e.addEventListener('click',()=>{let y=Number(e.dataset.y||((e.textContent.match(/\d{4}/)||[])[0]));if(y)showMonths(d,y)},true)})};let obs=new MutationObserver(attach);obs.observe(d.body,{childList:true,subtree:true});attach()}document.getElementById('app').addEventListener('load',hook)</script></body></html>
