<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#20352d"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>화담철학관 만세력</title><style>html,body{margin:0;width:100%;height:100%;background:#f3efe6}iframe{display:block;width:100%;height:100%;border:0;background:#f3efe6;padding-bottom:72px;box-sizing:border-box}.bottomNav{position:fixed;z-index:9999;left:0;right:0;bottom:0;height:68px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -2px 10px rgba(0,0,0,.06)}.navItem{border:0;background:#fff;color:#555;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 1px;cursor:pointer}.navItem .ico{font-size:22px;line-height:1}.navItem .txt{font-size:11px;font-weight:700;white-space:nowrap}.navItem.active{color:#c84d1b}.navItem.active .ico{transform:translateY(-1px)}@media(min-width:800px){.bottomNav{left:50%;transform:translateX(-50%);max-width:760px}}</style></head><body><iframe id="app" src="/stable.html?v=20260819-nav1" title="화담철학관 만세력"></iframe><nav class="bottomNav" aria-label="주요 메뉴"><button class="navItem active" data-target="home"><span class="ico">⌂</span><span class="txt">홈</span></button><button class="navItem" data-target="input"><span class="ico">✎</span><span class="txt">사주입력</span></button><button class="navItem" data-target="analysis"><span class="ico">♧</span><span class="txt">화담분석</span></button><button class="navItem" data-target="calendar"><span class="ico">▣</span><span class="txt">택일달력</span></button><button class="navItem" data-target="journal"><span class="ico">✣</span><span class="txt">화담일지</span></button></nav><script>const f=document.getElementById('app');let d=null,mode='main';function setActive(btn){document.querySelectorAll('.navItem').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}function loadMain(cb){if(mode!=='main'){mode='main';f.src='/stable.html?v=20260819-nav1';f.onload=()=>{setupMain();if(cb)setTimeout(cb,100)}}else if(cb)cb()}function topOf(el){return el?el.getBoundingClientRect().top+(d.defaultView.scrollY||0)-8:0}document.querySelectorAll('.navItem').forEach(btn=>btn.addEventListener('click',()=>{const t=btn.dataset.target;setActive(btn);if(t==='calendar'){mode='calendar';d=null;f.src='/calendar-v1.html?v=20260819-1';return}loadMain(()=>{if(!d)return;let el=t==='home'?d.body:t==='input'?(d.querySelector('.card')||d.getElementById('name')):t==='analysis'?(d.getElementById('result')||d.querySelector('.pillars')):d.getElementById('journalPanel');if(el)d.defaultView.scrollTo({top:topOf(el),behavior:'smooth'})})}));function setupMain(){try{d=f.contentDocument;if(!d)return;const detail=d.createElement('script');detail.src='/detail-v2.js?v=20260818-1';d.body.appendChild(detail);const journal=d.createElement('script');journal.src='/journal-v1.js?v=20260818-2';d.body.appendChild(journal)}catch(e){console.error(e)}}f.addEventListener('load',()=>{if(mode==='main')setupMain()});</script></body></html>
