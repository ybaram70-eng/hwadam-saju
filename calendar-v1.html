<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#20352d"><title>화담 택일달력</title><style>*{box-sizing:border-box}body{margin:0;background:#f3efe6;color:#252525;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.w{max-width:760px;margin:auto;padding:8px 7px 90px}.hero{background:#20352d;color:white;border-radius:10px;padding:18px;margin-bottom:9px}.hero small{color:#d8c59b}.hero h1{margin:8px 0 4px;font-size:25px}.hero p{margin:0;font-size:13px}.card{background:#fffdf9;border:1px solid #d6cdbd;border-radius:9px;padding:12px;margin-bottom:9px}h2{font-size:20px;margin:0 0 12px}.toolbar{display:grid;grid-template-columns:52px 1fr 52px;gap:7px;align-items:center}.toolbar button,.purpose button{border:1px solid #d4cab8;background:#fff;border-radius:8px;padding:11px;font-weight:700}.month{text-align:center;font-size:21px;font-weight:800}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.week div{text-align:center;padding:8px 0;font-size:12px;font-weight:800;color:#666}.day{min-height:67px;border:1px solid #e0d8ca;border-radius:7px;background:white;padding:5px;text-align:left}.day.muted{opacity:.28}.day.today{border:2px solid #b47a25}.day.selected{background:#20352d;color:white;border-color:#20352d}.day b{font-size:15px}.day small{display:block;margin-top:7px;font-size:10px;color:#777}.day.selected small{color:#e8eee9}.purpose{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.purpose button.active{background:#20352d;color:white;border-color:#20352d}.detail{background:#f7f1e5;border-radius:8px;padding:13px;line-height:1.65}.detail strong{font-size:18px;color:#20352d}.selectedBanner{background:#e8efe9;border:2px solid #20352d;border-radius:9px;padding:12px;margin-bottom:10px;font-weight:800;color:#20352d}.note{font-size:12px;color:#756b5e;margin-top:10px}@media(max-width:430px){.w{padding:5px 4px 86px}.day{min-height:58px;padding:4px}.purpose{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:23px}}</style></head><body><main class="w"><section class="hero"><small>和談 · HWADAM</small><h1>화담 택일달력</h1><p>날짜를 누르면 아래에 선택 결과가 바로 표시됩니다.</p></section><section class="card"><div class="toolbar"><button id="prev">‹</button><div class="month" id="month"></div><button id="next">›</button></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="days" id="days"></div></section><section class="card" id="resultCard"><div class="selectedBanner" id="selectedBanner"></div><h2>택일 용도</h2><div class="purpose" id="purpose"><button class="active">종합</button><button>계약</button><button>개업</button><button>이사</button><button>결혼</button><button>여행</button></div><h2 style="margin-top:18px">선택 날짜 결과</h2><div class="detail" id="detail"></div><div class="note">※ 우선 날짜 선택이 확실히 작동하도록 수정했습니다. 간지·충합·길흉의 정밀 판정은 검증된 만세력 계산값과 연결한 뒤 표시합니다.</div></section></main><script>const $=x=>document.getElementById(x),now=new Date();let view=new Date(now.getFullYear(),now.getMonth(),1),selected=new Date(now.getFullYear(),now.getMonth(),now.getDate()),purpose='종합';function pad(n){return String(n).padStart(2,'0')}function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function label(d){const wd=['일','월','화','수','목','금','토'][d.getDay()];return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+wd+')'}function renderDetail(){const text={종합:'선택한 날짜입니다. 개인 원국과 대운·세운의 충합을 함께 확인해 최종 택일합니다.',계약:'계약·서명 용도로 선택했습니다. 개인 원국과 날짜의 충합을 확인해 최종 판정합니다.',개업:'개업 용도로 선택했습니다. 대표자 원국과 사업 흐름을 함께 확인해 최종 판정합니다.',이사:'이사 용도로 선택했습니다. 가족 원국과 방향·날짜의 충을 함께 확인합니다.',결혼:'결혼 용도로 선택했습니다. 두 사람의 원국과 날짜의 충합을 함께 비교합니다.',여행:'여행·출발 용도로 선택했습니다. 이동 목적과 날짜의 충·형·해를 함께 확인합니다.'};$('selectedBanner').textContent='✓ '+label(selected)+' 선택됨';$('detail').innerHTML='<strong>'+label(selected)+'</strong><br>택일 용도: <b>'+purpose+'</b><br><br>'+text[purpose]}function render(){const y=view.getFullYear(),m=view.getMonth();$('month').textContent=y+'년 '+(m+1)+'월';const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());$('days').innerHTML='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const b=document.createElement('button');b.type='button';b.className='day'+(d.getMonth()!==m?' muted':'')+(key(d)===key(now)?' today':'')+(key(d)===key(selected)?' selected':'');b.innerHTML='<b>'+d.getDate()+'</b><small>'+['일','월','화','수','목','금','토'][d.getDay()]+'요일</small>';b.addEventListener('click',function(){selected=new Date(d.getFullYear(),d.getMonth(),d.getDate());view=new Date(d.getFullYear(),d.getMonth(),1);render();renderDetail();setTimeout(()=>$('resultCard').scrollIntoView({behavior:'smooth',block:'start'}),50)});$('days').appendChild(b)}}$('prev').addEventListener('click',()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()});$('next').addEventListener('click',()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()});document.querySelectorAll('#purpose button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#purpose button').forEach(x=>x.classList.remove('active'));b.classList.add('active');purpose=b.textContent.trim();renderDetail()}));render();renderDetail();</script></body></html>
