<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#20352d"><title>화담 택일달력</title><style>*{box-sizing:border-box}body{margin:0;background:#f3efe6;color:#252525;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.w{max-width:760px;margin:auto;padding:8px 7px 90px}.hero{background:#20352d;color:white;border-radius:10px;padding:18px;margin-bottom:9px}.hero small{color:#d8c59b}.hero h1{margin:8px 0 4px;font-size:25px}.hero p{margin:0;font-size:13px}.card{background:#fffdf9;border:1px solid #d6cdbd;border-radius:9px;padding:12px;margin-bottom:9px}h2{font-size:20px;margin:0 0 12px}.status{font-size:12px;padding:9px 11px;margin-bottom:9px;border-radius:8px;background:#e8efe9;color:#20352d}.customer{width:100%;padding:12px;border:1px solid #d4cab8;border-radius:8px;background:#fff;font-size:16px}.who{margin-top:8px;padding:10px;border-radius:8px;background:#f7f1e5;color:#20352d;font-weight:800}.toolbar{display:grid;grid-template-columns:52px 1fr 52px;gap:7px;align-items:center}.toolbar button,.purpose button{border:1px solid #d4cab8;background:#fff;border-radius:8px;padding:11px;font-weight:700}.month{text-align:center;font-size:21px;font-weight:800}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.week div{text-align:center;padding:8px 0;font-size:12px;font-weight:800;color:#666}.day{min-height:69px;border:1px solid #e0d8ca;border-radius:7px;background:white;padding:5px;text-align:left}.day.muted{opacity:.28}.day.today{border:2px solid #b47a25}.day.selected{background:#20352d;color:white;border-color:#20352d}.day b{font-size:15px}.day small{display:block;margin-top:4px;font-size:10px;color:#777}.day .ganji{font-weight:800;color:#8a5d22}.day.selected small,.day.selected .ganji{color:#e8eee9}.purpose{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.purpose button.active{background:#20352d;color:white;border-color:#20352d}.detail{background:#f7f1e5;border-radius:8px;padding:13px;line-height:1.75}.detail strong{font-size:18px;color:#20352d}.ganjiBig{font-size:23px;font-weight:900;color:#9b5f1d;margin:5px 0}.selectedBanner{background:#e8efe9;border:2px solid #20352d;border-radius:9px;padding:12px;margin-bottom:10px;font-weight:800;color:#20352d}.relbox{margin-top:12px;padding:11px;border:1px solid #d7cdbb;border-radius:8px;background:#fff}.relbox b{color:#20352d}.tag{display:inline-block;margin:4px 4px 0 0;padding:4px 7px;border-radius:999px;background:#eee7d9;font-size:12px}.warn{background:#f7e3df;color:#8c352d}.good{background:#e2efe5;color:#285d36}.note{font-size:12px;color:#756b5e;margin-top:10px}@media(max-width:430px){.w{padding:5px 4px 86px}.day{min-height:62px;padding:4px}.purpose{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:23px}}</style></head><body><main class="w"><section class="hero"><small>和談 · HWADAM</small><h1>화담 택일달력</h1><p>저장 고객을 선택하고 날짜별 일진과 원국 관계를 확인합니다.</p></section><div id="engine" class="status">만세력 엔진 연결 중…</div><section class="card"><h2>상담 고객</h2><select id="customer" class="customer"><option value="">고객을 선택해 주세요</option></select><div id="who" class="who">화담일지에 저장된 고객을 불러옵니다.</div></section><section class="card"><div class="toolbar"><button id="prev">‹</button><div class="month" id="month"></div><button id="next">›</button></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="days" id="days"></div></section><section class="card" id="resultCard"><div class="selectedBanner" id="selectedBanner"></div><h2>택일 용도</h2><div class="purpose" id="purpose"><button class="active">종합</button><button>계약</button><button>개업</button><button>이사</button><button>결혼</button><button>여행</button></div><h2 style="margin-top:18px">선택 날짜 결과</h2><div class="detail" id="detail"></div><div class="note">※ 일진과 고객 원국은 동일한 만세력 엔진으로 계산합니다. 현재 단계는 일지 중심의 합·충·형·파·해를 우선 표시하며, 용도별 최종 길흉 점수는 추가 검증 후 연결합니다.</div></section></main><script type="module">const $=x=>document.getElementById(x),now=new Date(),C='hwadam_customers_v1';let M=null,view=new Date(now.getFullYear(),now.getMonth(),1),selected=new Date(now.getFullYear(),now.getMonth(),now.getDate()),purpose='종합',cache={},client=null;const clash={자:'오',축:'미',인:'신',묘:'유',진:'술',사:'해',오:'자',미:'축',신:'인',유:'묘',술:'진',해:'사'},harm={자:'미',축:'오',인:'사',묘:'진',진:'묘',사:'인',오:'축',미:'자',신:'해',유:'술',술:'유',해:'신'},brk={자:'유',축:'진',인:'해',묘:'오',진:'축',사:'신',오:'묘',미:'술',신:'사',유:'자',술:'미',해:'인'},combine={자:'축',축:'자',인:'해',해:'인',묘:'술',술:'묘',진:'유',유:'진',사:'신',신:'사',오:'미',미:'오'},punishPairs=['자묘','묘자','인사','사인','사신','신사','인신','신인','축술','술축','술미','미술','축미','미축'];function pad(n){return String(n).padStart(2,'0')}function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function label(d){const wd=['일','월','화','수','목','금','토'][d.getDay()];return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+wd+')'}async function loadEngine(){for(const u of ['https://esm.sh/manseryeok@2.0.0?bundle','https://cdn.jsdelivr.net/npm/manseryeok@2.0.0/+esm','https://esm.run/manseryeok@2.0.0']){try{const m=await import(u);if(m?.calculateFourPillars){M=m;$('engine').textContent='✓ 정밀 만세력 엔진 준비 완료';return}}catch(e){}}$('engine').textContent='만세력 엔진 연결이 늦습니다. 잠시 후 새로고침해 주세요.'}function dayGanji(d){if(!M)return '';const k=key(d);if(cache[k])return cache[k];try{return cache[k]=M.calculateFourPillars({year:d.getFullYear(),month:d.getMonth()+1,day:d.getDate(),hour:12,minute:0,isLunar:false,dayBoundary:'midnight',gender:'female'}).toObject().day||''}catch{return ''}}function saved(){try{return JSON.parse(localStorage.getItem(C))||[]}catch{return []}}function fillCustomers(){const a=saved(),q=$('customer');q.innerHTML='<option value="">고객을 선택해 주세요</option>';a.forEach((c,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=(c.name||'이름없음')+' · '+[c.year,c.month,c.day].join('.');q.appendChild(o)});$('who').textContent=a.length?`저장 고객 ${a.length}명 · 고객을 선택하면 개인 택일 비교가 시작됩니다.`:'저장 고객이 없습니다. 먼저 화담일지에서 고객을 저장해 주세요.'}function clientPillars(c){if(!M||!c)return null;try{const r=M.calculateFourPillars({year:+c.year,month:+c.month,day:+c.day,hour:+(c.hour||12),minute:+(c.minute||0),isLunar:!!c.isLunar,isLeapMonth:!!c.isLeapMonth,dayBoundary:c.dayBoundary||'midnight',gender:c.gender||'female'});return r.toObject()}catch{return null}}function relation(a,b){const out=[];if(!a||!b)return out;if(combine[a]===b)out.push(['합', 'good']);if(clash[a]===b)out.push(['충','warn']);if(harm[a]===b)out.push(['해','warn']);if(brk[a]===b)out.push(['파','warn']);if(punishPairs.includes(a+b))out.push(['형','warn']);return out}function renderDetail(){const g=dayGanji(selected),text={종합:'일진과 고객 원국의 관계를 함께 확인합니다.',계약:'계약·서명일은 특히 일지 충·형·해가 강한 날을 신중히 검토합니다.',개업:'개업일은 대표자 원국과 일진의 관계를 우선 확인합니다.',이사:'이사일은 가족 원국과 방향까지 함께 검토해야 합니다.',결혼:'혼인 택일은 두 사람의 원국을 함께 비교해야 합니다.',여행:'출발일은 원국과 일진의 충·형·해를 함께 확인합니다.'};$('selectedBanner').textContent='✓ '+label(selected)+' 선택됨';let extra='';if(client&&M&&g){const p=clientPillars(client);if(p){const db=p.day?.[1],tb=g[1],rels=relation(db,tb);extra='<div class="relbox"><b>'+client.name+'님 개인 비교</b><br>고객 일주: <b>'+p.day+'</b> · 선택일 일진: <b>'+g+'</b><br>일지 관계: ';extra+=rels.length?rels.map(x=>'<span class="tag '+x[1]+'">'+db+tb+' '+x[0]+'</span>').join(''):'<span class="tag">직접적인 육합·충·형·파·해 없음</span>';extra+='<br><small>※ 일지 1차 비교 결과이며 원국 전체·대운·세운을 합쳐 최종 판단합니다.</small></div>'}}$('detail').innerHTML='<strong>'+label(selected)+'</strong><div class="ganjiBig">일진 '+(g||'계산 중…')+'</div>택일 용도: <b>'+purpose+'</b><br><br>'+text[purpose]+extra}function render(){const y=view.getFullYear(),m=view.getMonth();$('month').textContent=y+'년 '+(m+1)+'월';const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());$('days').innerHTML='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const b=document.createElement('button');b.type='button';b.className='day'+(d.getMonth()!==m?' muted':'')+(key(d)===key(now)?' today':'')+(key(d)===key(selected)?' selected':'');const g=dayGanji(d);b.innerHTML='<b>'+d.getDate()+'</b><small>'+['일','월','화','수','목','금','토'][d.getDay()]+'요일</small><small class="ganji">'+(g||'')+'</small>';b.onclick=()=>{selected=new Date(d.getFullYear(),d.getMonth(),d.getDate());view=new Date(d.getFullYear(),d.getMonth(),1);render();renderDetail();setTimeout(()=>$('resultCard').scrollIntoView({behavior:'smooth',block:'start'}),50)};$('days').appendChild(b)}}$('customer').onchange=()=>{const a=saved(),i=$('customer').value;client=i===''?null:a[+i];$('who').textContent=client?(client.name+'님 · '+[client.year,client.month,client.day].join('.')+' 선택됨'):'고객을 선택해 주세요.';renderDetail()};$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};document.querySelectorAll('#purpose button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#purpose button').forEach(x=>x.classList.remove('active'));b.classList.add('active');purpose=b.textContent.trim();renderDetail()});fillCustomers();render();renderDetail();await loadEngine();render();renderDetail();</script></body></html>
