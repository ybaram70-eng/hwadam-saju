<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#20352d"><title>화담철학관 만세력</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1e8}iframe{display:block;width:100%;height:100%;border:0;background:#f5f1e8}</style></head><body><iframe id="app" src="/app.html?v=20260818-6" title="화담철학관 만세력"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;const st=d.createElement('style');st.textContent='.db .dd{display:none!important}.db.active .dd{display:none!important}.hj-sec{margin-top:20px;padding:17px;border:2px solid #20352d;border-radius:18px;background:#fffdf8}.hj-sec h3{margin:0 0 10px}.hj-out{display:none;margin-top:12px}.hj-part{padding:14px;margin:9px 0;border-radius:13px;background:#f3efe7;font-size:13px;line-height:1.9}.hj-part b{display:block;color:#20352d;font-size:15px;margin-bottom:5px}.hj-head{padding:14px;border-radius:14px;background:#20352d;color:#fff;line-height:1.8;margin-bottom:10px}.hj-sub{color:#7a684c;font-weight:700}.hj-badge{display:inline-block;padding:4px 8px;margin:2px 4px 2px 0;border-radius:10px;background:#e7eee9;color:#20352d;font-size:11px;font-weight:700}.fxph{margin-top:18px;padding:16px;border:2px solid #8f443c;border-radius:18px;background:#fffaf5}.fx-row{padding:10px 11px;margin:7px 0;border-radius:12px;background:#fff;border:1px solid #e5d6ca;font-size:13px;line-height:1.7}.fx-type{display:inline-block;min-width:32px;text-align:center;padding:3px 7px;margin-right:6px;border-radius:8px;background:#8f443c;color:#fff;font-weight:800}';d.head.appendChild(st);function txt(id){return(d.getElementById(id)?.textContent||'').trim()}function activeText(sel){return(d.querySelector(sel)?.textContent||'').replace(/\s+/g,' ').trim()}function parsePillars(){return[txt('yP'),txt('mP'),txt('dP'),txt('hP')].map(x=>x.replace(/\s/g,''))}function extractGanji(s){const m=(s||'').match(/[갑을병정무기경신임계][자축인묘진사오미신유술해]/);return m?m[0]:''}const clash=['자오','축미','인신','묘유','진술','사해'],harm=['자미','축오','인사','묘진','신해','유술'],brk=['자유','축진','인해','묘오','사신','미술'],pun2=['자묘'],selfPun=['진','오','유','해'],pun3=[['인','사','신'],['축','술','미']];function pair(a,b,list){return list.includes(a+b)||list.includes(b+a)}function relationRows(ps,extra){const names=['년지','월지','일지','시지'],bs=ps.map(x=>x[1]),rows=[];for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){let a=bs[i],b=bs[j];if(pair(a,b,clash))rows.push(['충',names[i]+' '+a+' ↔ '+names[j]+' '+b,'원국 내부의 충: 이동·변화·대립이 활성화될 수 있습니다.']);if(pair(a,b,harm))rows.push(['해',names[i]+' '+a+' ↔ '+names[j]+' '+b,'원국 내부의 해: 관계·계획의 미세한 불편이나 어긋남을 살핍니다.']);if(pair(a,b,brk))rows.push(['파',names[i]+' '+a+' ↔ '+names[j]+' '+b,'원국 내부의 파: 기존 구조의 균열·변경 가능성을 살핍니다.']);if(pair(a,b,pun2))rows.push(['형',names[i]+' '+a+' ↔ '+names[j]+' '+b,'자묘형: 반복되는 긴장과 관계의 마찰을 살핍니다.']);if(a===b&&selfPun.includes(a))rows.push(['형',names[i]+' '+a+' ↔ '+names[j]+' '+b,'자형: 같은 기운이 겹치며 스스로 압박하거나 반복하는 성향을 살핍니다.'])}pun3.forEach(g=>{if(g.every(x=>bs.includes(x)))rows.push(['형',g.join('·')+' 삼형','원국에서 삼형이 완성되어 긴장·압박·변동성이 커질 수 있습니다.'])});if(extra&&extra.g){let eb=extra.g[1];bs.forEach((b,i)=>{if(pair(eb,b,clash))rows.push(['충',extra.name+' '+eb+' → '+names[i]+' '+b,extra.name+'이 원국 '+names[i]+'를 충합니다. 해당 궁의 변화·이동·충돌 여부를 살핍니다.']);if(pair(eb,b,harm))rows.push(['해',extra.name+' '+eb+' → '+names[i]+' '+b,extra.name+'이 원국 '+names[i]+'와 해를 이룹니다. 관계·계약·진행 과정의 어긋남을 점검합니다.']);if(pair(eb,b,brk))rows.push(['파',extra.name+' '+eb+' → '+names[i]+' '+b,extra.name+'이 원국 '+names[i]+'와 파를 이룹니다. 기존 계획이나 구조가 흔들리는지 살핍니다.']);if(pair(eb,b,pun2))rows.push(['형',extra.name+' '+eb+' → '+names[i]+' '+b,'자묘형이 작동합니다. 반복되는 긴장이나 관계 마찰을 살핍니다.']);if(eb===b&&selfPun.includes(eb))rows.push(['형',extra.name+' '+eb+' → '+names[i]+' '+b,'자형이 중첩됩니다. 같은 문제의 반복이나 자기 압박이 강해지는지 살핍니다.'])});pun3.forEach(g=>{const set=[...bs,eb];if(g.every(x=>set.includes(x))&&!g.every(x=>bs.includes(x)))rows.push(['형',extra.name+' 유입 → '+g.join('·')+' 삼형 완성',extra.name+'의 지지가 들어오며 원국과 삼형이 완성됩니다.'])})}return rows}function selectedExtras(){return[['대운','.lb.active'],['세운','.ab.active'],['월운','.mb.active'],['일진','.db.active']].map(([name,sel])=>({name,g:extractGanji(activeText(sel))})).filter(x=>x.g)}function renderFxph(){let box=d.getElementById('fxphBox');if(!box){const result=d.getElementById('result');if(!result)return;box=d.createElement('div');box.id='fxphBox';box.className='fxph';result.appendChild(box)}const ps=parsePillars();if(ps.some(x=>x.length<2)){box.innerHTML='<h3>형·충·파·해 상세판정</h3><div class="summary">사주팔자를 먼저 계산하면 원국의 형·충·파·해를 표시합니다.</div>';return}let groups=[{title:'원국',rows:relationRows(ps,null)}];selectedExtras().forEach(x=>groups.push({title:x.name+' '+x.g,rows:relationRows(ps,x).filter(r=>r[1].startsWith(x.name)||r[1].includes(x.name+' 유입'))}));let html='<h3>형·충·파·해 상세판정</h3><div class="summary">원국과 현재 선택한 대운·세운·월운·일진이 어느 궁을 건드리는지 표시합니다.</div>';groups.forEach(g=>{html+='<div class="hj-part"><b>'+g.title+'</b>';html+=g.rows.length?g.rows.map(r=>'<div class="fx-row"><span class="fx-type">'+r[0]+'</span><strong>'+r[1]+'</strong><br>'+r[2]+'</div>').join(''):'<div class="fx-row">현재 선택값과 원국 사이에 표시할 형·충·파·해가 없습니다.</div>';html+='</div>'});html+='<div class="note">형·충·파·해는 존재 자체만으로 길흉을 확정하지 않습니다. 월령·격국·용신과 어느 궁/십신이 영향을 받는지, 대운·세운에서 중첩되는지를 함께 판단합니다.</div>';box.innerHTML=html}function showDay(card){d.querySelectorAll('.db').forEach(x=>x.classList.remove('active'));card.classList.add('active');let box=d.getElementById('selectedDayDetail');if(!box){box=d.createElement('div');box.id='selectedDayDetail';box.className='summary';box.style.cssText='margin:12px 0 14px;padding:14px;border:3px solid #20352d;border-radius:13px;background:#edf3ef;font-size:14px;line-height:1.8;color:#232323';const s=d.getElementById('daySummary');if(s)s.insertAdjacentElement('afterend',box)}const detail=card.querySelector('.dd');box.innerHTML='<b style="font-size:16px">선택한 날짜 상세</b><br>'+(detail?detail.innerHTML:card.innerHTML);box.style.display='block';renderFxph()}function pick(e){const c=e.target?.closest?.('.db');if(c){e.preventDefault();e.stopPropagation();showDay(c);return}const luck=e.target?.closest?.('.lb,.ab,.mb');if(luck)setTimeout(renderFxph,80)}d.addEventListener('click',pick,true);d.addEventListener('touchend',pick,true);function addPanel(){if(!d.getElementById('result'))return;renderFxph()}new MutationObserver(()=>{if(d.getElementById('result')?.style.display!=='none')addPanel()}).observe(d.body,{childList:true,subtree:true,attributes:true});setTimeout(addPanel,500)})</script></body></html>
