<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비밀번호 재설정 | 화담철학관</title><style>body{margin:0;background:#f3efe6;font-family:system-ui,sans-serif;color:#20352d}.wrap{max-width:520px;margin:0 auto;padding:40px 18px}.card{background:#fffdf8;border:1px solid #ddd3c3;border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.06)}h1{font-size:24px}.f{display:grid;gap:12px}.f input{padding:14px;border:1px solid #d6cdbd;border-radius:12px;font-size:16px}.f button{padding:14px;border:0;border-radius:12px;background:#20352d;color:white;font-size:16px;font-weight:800}.msg{min-height:22px;color:#9a3c32;font-weight:700}.ok{color:#236646}</style></head><body><div class="wrap"><div class="card"><h1>비밀번호 재설정</h1><form class="f" id="f"><input id="p1" type="password" minlength="8" placeholder="새 비밀번호 8자 이상" required><input id="p2" type="password" minlength="8" placeholder="새 비밀번호 확인" required><div id="m" class="msg"></div><button>비밀번호 변경</button></form></div></div><script>const q=new URLSearchParams(location.search),token=q.get('token')||'',f=document.getElementById('f'),m=document.getElementById('m');f.onsubmit=async e=>{e.preventDefault();const a=document.getElementById('p1').value,b=document.getElementById('p2').value,btn=f.querySelector('button');if(a.length<8){m.textContent='비밀번호는 8자 이상 입력해 주세요.';return}if(a!==b){m.textContent='비밀번호가 서로 다릅니다.';return}btn.disabled=true;m.textContent='변경 중…';try{const r=await fetch('/api/auth-session?action=reset-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:a})});let j={};try{j=await r.json()}catch{}if(r.ok){m.className='msg ok';m.textContent='비밀번호가 변경되었습니다. 화담철학관에서 새 비밀번호로 로그인해 주세요.';btn.style.display='none'}else{m.textContent=j.error==='RESET_TOKEN_INVALID'?'링크가 만료되었거나 이미 사용되었습니다. 다시 요청해 주세요.':'비밀번호 변경에 실패했습니다.';btn.disabled=false}}catch{m.textContent='연결이 지연되고 있습니다.';btn.disabled=false}};</script></body></html>
