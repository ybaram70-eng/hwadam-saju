<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#20352d"><title>화담철학관 만세력</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:#232323;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.w{max-width:620px;margin:auto;padding:16px}.hero{background:#20352d;color:#fff;border-radius:24px;padding:24px;margin-bottom:14px}.hero h1{margin:5px 0 8px;font-family:serif}.hero p{margin:0;color:#dce4df;line-height:1.6}.card{background:#fffdf8;border:1px solid #e4dccf;border-radius:20px;padding:18px;margin-bottom:14px}label{display:block;font-size:13px;color:#6f6b64;margin:12px 2px 6px}input,select,button{width:100%;padding:13px;border-radius:13px;border:1px solid #d7cdbb;background:#fff;font-size:16px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:8px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg label{margin:0;padding:12px;text-align:center;border:1px solid #d7cdbb;border-radius:13px;color:#333}.seg input{width:auto}.hide{display:none!important}button{margin-top:16px;background:#20352d;color:#fff;border:0;font-weight:800}.status{padding:10px 12px;border-radius:12px;background:#eaf0eb;color:#294337;margin-bottom:14px;font-size:13px}.err{background:#fff0ee;color:#9e3d33}.result{display:none}.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.p{background:#faf7ef;border:1px solid #dfd5c3;border-radius:15px;padding:12px 3px;text-align:center}.p small{display:block;color:#777}.p b{display:block;font:700 24px serif;margin:4px}.p em{font:normal 15px serif;color:#71634c}.info{margin-top:12px;border:1px solid #e4dccf;border-radius:14px;overflow:hidden}.r{display:grid;grid-template-columns:75px 1fr;border-bottom:1px solid #e4dccf}.r:last-child{border:0}.r b,.r span{padding:10px;font-size:12px;line-height:1.6}.r b{background:#f2eee6}.luck{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.lb{border:1px solid #e4dccf;border-radius:13px;padding:10px}.lb b{font-family:serif;font-size:19px}.lb small{display:block;color:#777}.note{margin-top:12px;padding:10px;background:#fff8e9;border-left:4px solid #c99538;font-size:11px;line-height:1.6}</style></head><body><div class="w"><section class="hero"><small>和談 · HWADAM</small><h1>화담철학관 만세력</h1><p>양력·음력 생년월일시를 입력하면 사주팔자와 십신·공망·대운을 확인할 수 있습니다.</p></section><div id="st" class="status">정밀 만세력 엔진을 불러오는 중입니다…</div><section class="card"><h2>출생 정보</h2><label>이름</label><input id="name" placeholder="이름"><label>성별</label><select id="gender"><option value="female">여성</option><option value="male">남성</option></select><label>양력 / 음력</label><div class="seg"><label><input type="radio" name="cal" value="solar" checked> 양력</label><label><input type="radio" name="cal" value="lunar"> 음력</label></div><div id="leapBox" class="hide"><label>음력 월</label><select id="leap"><option value="normal">평달</option><option value="leap">윤달</option></select></div><label>생년월일</label><div class="g3"><input id="year" inputmode="numeric" placeholder="1965"><input id="month" inputmode="numeric" placeholder="12"><input id="day" inputmode="numeric" placeholder="14"></div><label>출생시간</label><div class="g2"><input id="hour" inputmode="numeric" placeholder="14"><input id="minute" inputmode="numeric" placeholder="50"></div><label>자시 일주 기준</label><select id="boundary"><option value="midnight">자정 기준</option><option value="jasi">야자시 — 23시부터 다음 날</option><option value="splitJasi">분자시</option></select><button id="go" disabled>사주팔자 계산</button></section><section id="result" class="card result"><h2 id="who"></h2><div id="date" style="font-size:12px;color:#666;margin-bottom:12px"></div><div class="pillars"><div class="p"><small>년주</small><b id="yP"></b><em id="yH"></em></div><div class="p"><small>월주</small><b id="mP"></b><em id="mH"></em></div><div class="p"><small>일주</small><b id="dP"></b><em id="dH"></em></div><div class="p"><small>시주</small><b id="hP"></b><em id="hH"></em></div></div><div class="info"><div class="r"><b>일간</b><span id="dm"></span></div><div class="r"><b>오행</b><span id="el"></span></div><div class="r"><b>십신</b><span id="tg"></span></div><div class="r"><b>공망</b><span id="vb"></span></div></div><h2 style="margin-top:18px">대운</h2><div id="lm" style="font-size:12px;color:#666;margin-bottom:9px"></div><div id="luck" class="luck"></div><div class="note">이 화면은 만세력 계산값입니다. 용신·격국·신강신약 등은 별도 해석 단계입니다.</div></section></div><script type="module">let M;const $=x=>document.getElementById(x),HS={갑:'甲',을:'乙',병:'丙',정:'丁',무:'戊',기:'己',경:'庚',신:'辛',임:'壬',계:'癸'},HB={자:'子',축:'丑',인:'寅',묘:'卯',진:'辰',사:'巳',오:'午',미:'未',신:'申',유:'酉',술:'戌',해:'亥'},hj=x=>x&&x.length>1?(HS[x[0]]||'')+(HB[x[1]]||''):'';try{M=await import('https://esm.sh/manseryeok?bundle');$('st').textContent='정밀 만세력 엔진 준비 완료';$('go').disabled=false}catch(e){$('st').className='status err';$('st').textContent='엔진을 불러오지 못했습니다. 인터넷 연결 후 새로고침해 주세요.'}document.querySelectorAll('input[name=cal]').forEach(x=>x.onchange=()=>$('leapBox').classList.toggle('hide',document.querySelector('input[name=cal]:checked').value!=='lunar'));const fmt=o=>o?`${o.year}.${String(o.month).padStart(2,'0')}.${String(o.day).padStart(2,'0')}`:'';function one(x){if(!x)return'-';if(typeof x==='string')return x;return`${x.stem??'-'}/${x.branch??'-'}`}function elem(p){return`${p[0]}(${M.getHeavenlyStemElement(p[0])}) / ${p[1]}(${M.getEarthlyBranchElement(p[1])})`}$('go').onclick=()=>{try{let y=+$('year').value,m=+$('month').value,d=+$('day').value,h=+$('hour').value,mi=+$('minute').value;if(!y||!m||!d||h<0||h>23||mi<0||mi>59)throw Error('생년월일과 시간을 확인해 주세요.');let lunar=document.querySelector('input[name=cal]:checked').value==='lunar',info={year:y,month:m,day:d,hour:h,minute:mi,isLunar:lunar,isLeapMonth:lunar&&$('leap').value==='leap',dayBoundary:$('boundary').value,gender:$('gender').value},r=M.calculateFourPillars(info),k=r.toObject(),sol,lu;if(lunar){sol=M.lunarToSolar(y,m,d,info.isLeapMonth);lu={year:y,month:m,day:d,isLeapMonth:info.isLeapMonth}}else{sol={year:y,month:m,day:d};lu=M.solarToLunar(y,m,d)}$('who').textContent=($('name').value.trim()||'고객')+'님의 사주팔자';$('date').textContent=`양력 ${fmt(sol)} · 음력 ${fmt(lu)} · 입력시간 ${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;[['y',k.year],['m',k.month],['d',k.day],['h',k.hour]].forEach(a=>{$(a[0]+'P').textContent=a[1];$(a[0]+'H').textContent=hj(a[1])});$('dm').textContent=`${k.day[0]} 일간 · ${M.getHeavenlyStemElement(k.day[0])}`;$('el').innerHTML=`년 ${elem(k.year)}<br>월 ${elem(k.month)}<br>일 ${elem(k.day)}<br>시 ${elem(k.hour)}`;$('tg').textContent=['year','month','day','hour'].map((q,i)=>['년','월','일','시'][i]+': '+one(r.tenGods?.[q])).join(' · ');$('vb').textContent=Array.isArray(r.voidBranches)?r.voidBranches.join(' · '):(r.voidBranches||'-');let lp=r.luckPillars;if(lp){$('lm').textContent=`${lp.forward?'순행':'역행'} · 대운 시작 ${lp.startAge??'-'}세`;$('luck').innerHTML=(lp.pillars||[]).slice(0,10).map(x=>`<div class="lb"><b>${x.korean||''}</b><small>${hj(x.korean||'')} · ${x.age??''}세</small></div>`).join('')}else{$('lm').textContent='대운 정보 없음';$('luck').innerHTML=''}$('result').style.display='block';$('st').className='status';$('st').textContent='계산 완료';$('result').scrollIntoView({behavior:'smooth'})}catch(e){$('st').className='status err';$('st').textContent='계산 오류: '+e.message;scrollTo({top:0,behavior:'smooth'})}};</script></body></html>
